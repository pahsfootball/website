<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAA Team Directory</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pahs: {
                            dark: '#0f0f0f',
                            card: '#18181b',
                            input: '#27272a',
                            gold: '#fbbf24',
                        }
                    },
                    fontFamily: {
                        'head': ['Teko', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        marquee: 'marquee 25s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(-100%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #adadad; color: #18181b; font-family: 'Inter', sans-serif; min-height: 100vh; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #adadad; }
        ::-webkit-scrollbar-thumb { background: #71717a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        .directory-card { background: #f4f4f5; border: 1px solid rgba(0, 0, 0, 0.1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .directory-card:hover { transform: translateY(-4px); background: #ffffff; border-color: rgba(0, 0, 0, 0.15); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6); }
        .modern-input { background: #f4f4f5; border: 2px solid #fbbf24; color: #18181b; transition: all 0.3s ease; }
        .modern-input:focus { background: #ffffff; border-color: #fbbf24; outline: none; box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
        h1, h2, h3, .teko-font { font-family: 'Teko', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body class="antialiased selection:bg-pahs-gold selection:text-black">

<div class="sticky top-0 z-40 w-full shadow-2xl">
    <div class="bg-black border-b border-white/5 py-1.5 overflow-hidden">
        <div class="animate-marquee whitespace-nowrap text-pahs-gold text-xs font-bold font-head tracking-widest text-sm">
            • DATA SOURCED FROM PUBLIC RECORDS • INFORMATION MAY VARY • CHECK LOCAL LISTINGS FOR ACCURACY •
        </div>
    </div>

    <header class="bg-[#0f0f0f]/90 backdrop-blur-xl border-b border-white/10 py-4 px-4 sm:px-6 transition-all">
        <div class="max-w-7xl mx-auto flex flex-col gap-5">
            <div class="flex items-center justify-between">
                <a href="index.html" class="group flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-pahs-gold text-white hover:text-black border border-white/10 rounded-lg transition-all duration-300">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span class="text-sm font-bold font-head text-lg pt-0.5">BACK</span>
                </a>
                <h1 class="text-3xl font-bold text-white tracking-wide hidden sm:block">Team Directory</h1>
            </div>

            <div class="relative w-full group">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-500 group-focus-within:text-pahs-gold transition-colors z-10">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Search schools, towns, counties..." class="modern-input w-full pl-11 pr-10 py-3.5 rounded-xl text-base shadow-inner">
                <button id="clearBtn" class="absolute inset-y-0 right-3 text-gray-500 hover:text-pahs-gold hidden transition-colors z-10">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <select id="districtFilter" class="modern-input px-4 py-2.5 rounded-lg text-sm font-semibold cursor-pointer">
                    <option value="All">All Districts</option>
                </select>
                <select id="classFilter" class="modern-input px-4 py-2.5 rounded-lg text-sm font-semibold cursor-pointer">
                    <option value="All">All Classes</option>
                </select>
                <div id="filterSummary" class="hidden flex items-center gap-2 ml-auto">
                    <span class="text-xs font-bold text-gray-300 uppercase tracking-wider font-head text-lg">Filtered by:</span>
                    <span id="activeFiltersList" class="flex gap-2"></span>
                    <button id="resetFiltersLink" class="text-xs font-bold text-red-400 hover:text-red-300 ml-2 uppercase tracking-wide font-head text-lg pt-0.5">Clear</button>
                </div>
            </div>
        </div>
    </header>
</div>

<main class="max-w-7xl mx-auto px-4 sm:px-8 pb-12 mt-6">
    <div id="loading" class="flex flex-col justify-center items-center py-32"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-pahs-gold mb-4"></i><p class="font-head text-2xl text-gray-800">Loading directory...</p></div>
    <div id="teamGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 hidden pt-4"></div>
    <div id="noResults" class="hidden flex flex-col items-center justify-center py-32 text-center">
        <h3 class="text-2xl font-head text-gray-900">No teams found</h3>
        <button id="resetAllBtn" class="mt-6 px-8 py-2 bg-pahs-gold text-black rounded-lg font-head text-xl font-bold border border-yellow-500">RESET ALL</button>
    </div>
</main>

<div id="modalOverlay" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-md transition-opacity opacity-0">
    <div id="modalContent" class="bg-[#18181b] border border-white/10 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-all duration-300 flex flex-col max-h-[90vh]">
        <div id="modalHeaderBanner" class="relative pt-12 pb-6 px-6 flex flex-col items-center text-center">
            <button id="closeModalX" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-black/40 text-white"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="modalSchool" class="text-4xl font-bold font-head text-white drop-shadow-md">School Name</h2>
            <p id="modalTeam" class="text-white/90 font-medium text-lg font-head tracking-widest">Team Name</p>
            <div class="absolute inset-0 bg-gradient-to-t from-[#18181b] to-transparent z-0"></div>
        </div>
        <div class="p-6 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-[#27272a] p-3 rounded-xl border border-white/5 text-center"><p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Class</p><p id="modalClass" class="text-2xl font-bold font-head text-white">-</p></div>
                <div class="bg-[#27272a] p-3 rounded-xl border border-white/5 text-center"><p class="text-[10px] text-gray-400 font-bold uppercase mb-1">District</p><p id="modalDistrict" class="text-2xl font-bold font-head text-white">-</p></div>
            </div>
            <div class="space-y-3">
                <div id="modalLocationContainer" class="flex items-center gap-4 p-4 rounded-xl bg-[#27272a] border border-white/5 cursor-pointer hover:bg-[#3f3f46] transition-colors">
                    <i class="fa-solid fa-location-dot text-red-500"></i>
                    <div><p class="text-[10px] text-gray-400 font-bold uppercase">Location</p><p id="modalCity" class="text-gray-200 font-semibold text-sm">City, State</p></div>
                </div>
                <div class="p-4 rounded-xl bg-[#27272a] border border-white/5"><p class="text-[10px] text-gray-400 font-bold uppercase">Conference</p><p id="modalConference" class="text-gray-200 text-sm">No Data</p></div>
            </div>
            <div class="mt-6 pt-6 border-t border-white/10 space-y-3">
                <a id="modalSearchLink" href="#" target="_blank" class="flex items-center justify-center w-full py-3.5 rounded-xl font-bold font-head text-2xl border border-white/10 tracking-wide"><i class="fa-brands fa-google mr-2 text-lg"></i> SEARCH HISTORY</a>
                <button id="followBtn" class="flex items-center justify-center w-full py-3.5 rounded-xl font-bold font-head text-2xl bg-pahs-gold text-black transition-colors"><i id="followIcon" class="fa-solid fa-star mr-2"></i> <span id="followText">FOLLOW TEAM</span></button>
            </div>
        </div>
    </div>
</div>

<div id="mapModalOverlay" class="fixed inset-0 bg-black/95 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-[#121212] w-full max-w-5xl h-[80vh] rounded-2xl overflow-hidden shadow-2xl flex flex-col border border-gray-700">
        <div class="px-4 py-3 bg-[#18181b] border-b border-gray-700 flex justify-between items-center shrink-0">
            <span class="font-bold text-gray-200 font-head text-xl tracking-wide"><i class="fa-solid fa-satellite text-pahs-gold mr-2"></i>Satellite View</span>
            <button id="closeMapBtn" class="w-8 h-8 rounded-full bg-[#27272a] text-gray-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe id="mapFrame" class="flex-1 w-full bg-black" frameborder="0"></iframe>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDUYZtoan7SgDO6VUi3LT50wFPSMdObEfM",
        authDomain: "pahs-football.firebaseapp.com",
        projectId: "pahs-football",
        storageBucket: "pahs-football.firebasestorage.app",
        messagingSenderId: "260294523190",
        appId: "1:260294523190:web:b3963804702d2a03749b97",
        measurementId: "G-2J69C1LS6D"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const sheetUrl = "https://docs.google.com/spreadsheets/d/1-FvaWHAtW6v690e0TLkMQPYMhUZ0dJ9kz6heqpCyfqo/gviz/tq?tqx=out:csv&sheet=TeamDirectory";
    let allData = [], filteredData = [], currentTeam = "", isFollowing = false;

    const colorNameMap = { "white": "#FFFFFF", "black": "#000000", "gold": "#FFD700", "yellow": "#FFFF00", "red": "#EF4444", "blue": "#3B82F6", "green": "#22C55E", "navy": "#1e3a8a", "maroon": "#7f1d1d" };

    const els = {
        grid: document.getElementById('teamGrid'), loading: document.getElementById('loading'),
        noResults: document.getElementById('noResults'), search: document.getElementById('searchInput'),
        clear: document.getElementById('clearBtn'), district: document.getElementById('districtFilter'),
        class: document.getElementById('classFilter'), summary: document.getElementById('filterSummary'),
        summaryList: document.getElementById('activeFiltersList'), modalOverlay: document.getElementById('modalOverlay'),
        modalContent: document.getElementById('modalContent'), mapOverlay: document.getElementById('mapModalOverlay'),
        mapFrame: document.getElementById('mapFrame'), followBtn: document.getElementById('followBtn'),
        followText: document.getElementById('followText'), followIcon: document.getElementById('followIcon')
    };

    document.addEventListener('DOMContentLoaded', fetchData);
    els.search.addEventListener('input', () => { handleSearch(); els.clear.classList.toggle('hidden', els.search.value.trim().length === 0); });
    els.clear.addEventListener('click', () => { els.search.value = ''; els.clear.classList.add('hidden'); handleSearch(); els.search.focus(); });
    els.district.addEventListener('change', handleSearch);
    els.class.addEventListener('change', handleSearch);
    document.getElementById('resetFiltersLink').addEventListener('click', resetAllFilters);
    document.getElementById('resetAllBtn').addEventListener('click', resetAllFilters);
    document.getElementById('closeModalX').addEventListener('click', closeModal);
    els.modalOverlay.addEventListener('click', (e) => { if(e.target === els.modalOverlay) closeModal(); });
    document.getElementById('closeMapBtn').addEventListener('click', closeMapModal);
    els.mapOverlay.addEventListener('click', (e) => { if(e.target === els.mapOverlay) closeMapModal(); });

    async function fetchData() {
        Papa.parse(sheetUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: res => {
                allData = res.data.map(row => {
                    const nr = {}; Object.keys(row).forEach(k => nr[k.trim()] = row[k]);
                    if(nr['Team']) nr['Team'] = nr['Team'].replace(/^\*+|\*+$/g, '').trim();
                    if(nr['School']) nr['School'] = nr['School'].replace(/^\*+|\*+$/g, '').trim();
                    if(nr['District']) nr['District'] = nr['District'].replace(/district/gi, '').trim();
                    return nr;
                }).filter(r => r['School']);

                filteredData = allData;
                populateFilters(allData);
                renderCards(filteredData);
                els.loading.classList.add('hidden');
                els.grid.classList.remove('hidden');

                // --- UPDATED DEEP LINKING: Auto-fill Search Bar ---
                const urlParams = new URLSearchParams(window.location.search);
                const teamParam = urlParams.get('team');
                if (teamParam) {
                    els.search.value = teamParam;
                    els.clear.classList.remove('hidden');
                    handleSearch(); 
                    // Optional: If you also want to pop the modal for the exact match
                    const matchIdx = allData.findIndex(r => r['School'] === teamParam);
                    if (matchIdx !== -1) setTimeout(() => window.openModal(matchIdx), 300);
                }
            }
        });
    }

    function renderCards(data) {
        els.grid.innerHTML = '';
        if(!data.length) { els.noResults.classList.remove('hidden'); return; }
        else els.noResults.classList.add('hidden');
        data.forEach((row, idx) => {
            const p = colorNameMap[(row['Colors']||'').split(/[&/,]+/)[0].trim().toLowerCase()] || '#a1a1aa';
            const card = document.createElement('div');
            card.className = "directory-card rounded-2xl cursor-pointer flex flex-col justify-between group";
            card.onclick = () => window.openModal(idx);
            card.innerHTML = `<div class="absolute left-0 top-0 bottom-0 w-1.5" style="background-color: ${p};"></div>
                <div class="p-5 pl-6"><h3 class="font-bold text-2xl font-head text-gray-900 mb-1">${row['School']}</h3><p class="text-gray-600 font-medium text-sm">${row['Team'] || 'Team'}</p></div>
                <div class="px-5 pl-6 pb-4 pt-3 mt-auto border-t border-gray-200 text-gray-500 text-xs font-bold uppercase"><i class="fa-solid fa-location-dot text-red-500/80 mr-1"></i>${row['City/Town']||'PA'}</div>`;
            els.grid.appendChild(card);
        });
    }

    function handleSearch() {
        const q = els.search.value.toLowerCase().trim();
        const d = els.district.value, c = els.class.value;
        filteredData = allData.filter(r => {
            const txt = (r['School']+r['Team']+r['City/Town']).toLowerCase();
            return (!q || txt.includes(q)) && (d === 'All' || r['District'] == d) && (c === 'All' || r['Class'] == c);
        });
        renderCards(filteredData);
    }

    function populateFilters(data) {
        const dSet = new Set(), cSet = new Set();
        data.forEach(r => { if(r['District']) dSet.add(r['District']); if(r['Class']) cSet.add(r['Class'].trim()); });
        Array.from(dSet).sort().forEach(d => els.district.add(new Option(`District ${d}`, d)));
        Array.from(cSet).sort().forEach(c => els.class.add(new Option(`Class ${c}`, c)));
    }

    function resetAllFilters() { els.search.value = ''; els.district.value = 'All'; els.class.value = 'All'; handleSearch(); }

    window.openModal = async function(idx) {
        const d = filteredData[idx]; currentTeam = d['School'];
        document.getElementById('modalSchool').innerText = d['School'];
        document.getElementById('modalTeam').innerText = d['Team'] || 'Varsity Football';
        document.getElementById('modalClass').innerText = d['Class'] || '-';
        document.getElementById('modalDistrict').innerText = d['District'] || '-';
        document.getElementById('modalCity').innerText = d['City/Town'] || 'Unknown';
        document.getElementById('modalConference').innerText = d['Conference/League'] || 'N/A';
        const aiQuery = `Overview of ${d['School']} football Pennsylvania`;
        document.getElementById('modalSearchLink').href = `https://www.google.com/search?q=${encodeURIComponent(aiQuery)}`;
        
        const user = auth.currentUser;
        if (user) {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists()) {
                const followed = userSnap.data().followedTeams || [];
                isFollowing = followed.includes(currentTeam);
                updateFollowUI();
            }
        }
        els.modalOverlay.classList.remove('hidden');
        setTimeout(() => { els.modalOverlay.classList.remove('opacity-0'); els.modalContent.classList.replace('scale-95','scale-100'); }, 10);
    };

    function updateFollowUI() {
        if (isFollowing) {
            els.followBtn.classList.replace('bg-pahs-gold', 'bg-red-600'); els.followBtn.classList.add('text-white');
            els.followText.innerText = "UNFOLLOW TEAM"; els.followIcon.classList.replace('fa-star', 'fa-trash');
        } else {
            els.followBtn.classList.replace('bg-red-600', 'bg-pahs-gold'); els.followBtn.classList.remove('text-white');
            els.followText.innerText = "FOLLOW TEAM"; els.followIcon.classList.replace('fa-trash', 'fa-star');
        }
    }

    els.followBtn.addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user) { if(confirm("Login required. Go to login?")) window.location.href="login.html"; return; }
        const userRef = doc(db, "users", user.uid);
        if (isFollowing) { await updateDoc(userRef, { followedTeams: arrayRemove(currentTeam) }); isFollowing = false; }
        else { await updateDoc(userRef, { followedTeams: arrayUnion(currentTeam) }); isFollowing = true; }
        updateFollowUI();
    });

    window.closeModal = () => { els.modalOverlay.classList.add('opacity-0'); els.modalContent.classList.replace('scale-100','scale-95'); setTimeout(() => els.modalOverlay.classList.add('hidden'), 300); };
    window.openMapModal = (loc) => { els.mapOverlay.classList.remove('hidden'); els.mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(loc + ", PA")}&output=embed&t=k`; };
    window.closeMapModal = () => { els.mapOverlay.classList.add('hidden'); els.mapFrame.src = ''; };
</script>
</body>
</html>
