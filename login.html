<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PAHS Football</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #adadad;
            --card-bg: #f4f4f5; 
            --text-main: #18181b;
            --text-sub: #52525b; 
            --gold-base: #fbbf24;
            --gold-hover: #f59e0b;
            --border-light: rgba(0, 0, 0, 0.1);
            --font-head: 'Teko', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-main); font-family: var(--font-body);
            color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh;
            align-items: center; justify-content: center;
        }

        .auth-container {
            width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); overflow: hidden;
            border-top: 5px solid var(--gold-base); padding: 30px; box-sizing: border-box;
        }

        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h1 { font-family: var(--font-head); font-size: 38px; text-transform: uppercase; margin: 0; line-height: 1; }
        .auth-header p { color: var(--text-sub); font-size: 14px; font-weight: 600; text-transform: uppercase; margin-top: 5px; }

        label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 800; display: block; }
        input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="tel"] { 
            width: 100%; background: #ffffff; border: 1px solid #d1d5db; padding: 12px; border-radius: 8px; 
            font-family: var(--font-body); font-size: 14px; transition: 0.2s; box-sizing: border-box; margin-bottom: 16px;
        }
        input:focus { border-color: var(--gold-base); outline: none; box-shadow: 0 0 0 3px rgba(251,191,36,0.3); }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            background: #e4e4e7;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        .checkbox-container input[type="checkbox"] {
            margin-top: 2px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-container label {
            margin-bottom: 0;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
            line-height: 1.4;
            color: #3f3f46;
        }
        .checkbox-container a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%; background: var(--gold-base); color: black; font-family: var(--font-head); font-size: 22px; 
            padding: 12px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; 
            font-weight: bold; transition: 0.3s; margin-top: 5px;
        }
        .btn-primary:hover { background: var(--gold-hover); transform: translateY(-2px); }

        .btn-secondary {
            width: 100%; background: transparent; color: var(--text-sub); border: 1px solid var(--border-light);
            padding: 10px; font-size: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; transition: 0.2s;
        }
        .btn-secondary:hover { background: rgba(0,0,0,0.05); color: var(--text-main); }

        .error-message { color: #ef4444; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 10px; display: none; }
        .success-message { color: #10b981; font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 10px; display: none; }
        
        .forgot-password { color: var(--gold-hover); font-size: 13px; font-weight: 700; text-decoration: none; display: block; text-align: right; margin-top: 0px; margin-bottom: 15px; transition: 0.2s; }
        .forgot-password:hover { text-decoration: underline; color: #d97706; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-sub); text-decoration: none; font-size: 14px; font-weight: 600; }
        .back-link:hover { color: var(--gold-hover); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1 id="formTitle">Portal Access</h1>
            <p id="formSubtitle">Sign in to your account</p>
        </div>

        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>

        <form id="authForm">
            <div id="signUpFields" class="hidden">
                <label>First Name <span style="color:red">*</span></label>
                <input type="text" id="fNameInput" placeholder="John">

                <label>Last Name <span style="color:red">*</span></label>
                <input type="text" id="lNameInput" placeholder="Doe">

                <label>Username <span style="color:red">*</span></label>
                <input type="text" id="usernameSignupInput" placeholder="superfan123">

                <label>Date of Birth <span style="color:red">*</span></label>
                <input type="date" id="dobInput">

                <label>Mobile Number (Optional)</label>
                <input type="tel" id="phoneInput" placeholder="xxx-xxx-xxxx">
            </div>

            <label>Email Address <span style="color:red">*</span></label>
            <input type="email" id="emailInput" required placeholder="fan@example.com">

            <label>Password <span style="color:red">*</span></label>
            <input type="password" id="passwordInput" required placeholder="••••••••">

            <a href="#" id="forgotPasswordBtn" class="forgot-password">Forgot Password?</a>

            <div id="termsContainer" class="checkbox-container hidden">
                <input type="checkbox" id="termsCheckbox">
                <label for="termsCheckbox">
                    I acknowledge that PAHS Football is a family-friendly environment. I agree to the <a href="terms.html" target="_blank">Terms and Conditions</a> and understand that any violations may result in account suspension or a permanent ban.
                </label>
            </div>

            <button type="submit" id="mainSubmitBtn" class="btn-primary">Sign In</button>
            <button type="button" id="toggleModeBtn" class="btn-secondary">Need an account? Sign Up</button>
        </form>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>

    <div id="spamWarningModal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0 duration-300">
        <div id="spamWarningModalContent" class="bg-white border-t-4 border-pahs-gold w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform scale-95 transition-all duration-300 flex flex-col">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl text-yellow-600 shadow-inner">
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>
                <h2 class="font-head text-3xl uppercase tracking-wide text-gray-900 mb-2">Check Your Spam!</h2>
                <p class="text-sm text-gray-600 mb-6 font-body leading-relaxed">
                    Your account has been successfully created. We just sent a verification link to your email. <strong class="text-red-600">Please check your Junk or Spam folder</strong> as it often ends up there!
                </p>
                <button onclick="closeSpamModal()" class="w-full bg-pahs-dark text-pahs-gold font-head font-bold text-2xl uppercase tracking-widest py-3 rounded-xl shadow-md hover:bg-black transition-all">
                    I Understand
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUYZtoan7SgDO6VUi3LT50wFPSMdObEfM",
            authDomain: "pahs-football.firebaseapp.com",
            projectId: "pahs-football",
            storageBucket: "pahs-football.firebasestorage.app",
            messagingSenderId: "260294523190",
            appId: "1:260294523190:web:b3963804702d2a03749b97",
            measurementId: "G-2J69C1LS6D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUpMode = false;

        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const signUpFields = document.getElementById('signUpFields');
        const termsContainer = document.getElementById('termsContainer');
        const termsCheckbox = document.getElementById('termsCheckbox');
        const mainSubmitBtn = document.getElementById('mainSubmitBtn');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const usernameSignupInput = document.getElementById('usernameSignupInput');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');

        // Username Profanity List
        const badWords = ['fuck', 'shit', 'bitch', 'asshole', 'dick', 'pussy', 'bastard', 'slut', 'whore', 'cunt', 'fag', 'faggot', 'nigger', 'cock'];

        function containsProfanity(text) {
            const lowerText = text.toLowerCase();
            return badWords.some(word => lowerText.includes(word));
        }

        function showError(message) {
            successMsg.style.display = 'none';
            errorMsg.innerText = message;
            errorMsg.style.display = 'block';
        }

        function showSuccess(message) {
            errorMsg.style.display = 'none';
            successMsg.innerText = message;
            successMsg.style.display = 'block';
        }

        // --- SPAM MODAL CONTROLS ---
        window.openSpamModal = function() {
            const modal = document.getElementById('spamWarningModal');
            const content = document.getElementById('spamWarningModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        };

        window.closeSpamModal = function() {
            const modal = document.getElementById('spamWarningModal');
            const content = document.getElementById('spamWarningModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        };

        toggleModeBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (isSignUpMode) {
                signUpFields.classList.remove('hidden');
                termsContainer.classList.remove('hidden');
                forgotPasswordBtn.classList.add('hidden');
                mainSubmitBtn.innerText = "Create Account";
                toggleModeBtn.innerText = "Already have an account? Sign In";
                formTitle.innerText = "Join the Team";
                formSubtitle.innerText = "Create your fan account";
                document.getElementById('fNameInput').required = true;
                document.getElementById('lNameInput').required = true;
                document.getElementById('dobInput').required = true;
                usernameSignupInput.required = true;
                termsCheckbox.required = true;
            } else {
                signUpFields.classList.add('hidden');
                termsContainer.classList.add('hidden');
                forgotPasswordBtn.classList.remove('hidden');
                mainSubmitBtn.innerText = "Sign In";
                toggleModeBtn.innerText = "Need an account? Sign Up";
                formTitle.innerText = "Portal Access";
                formSubtitle.innerText = "Sign in to your account";
                document.getElementById('fNameInput').required = false;
                document.getElementById('lNameInput').required = false;
                document.getElementById('dobInput').required = false;
                usernameSignupInput.required = false;
                termsCheckbox.required = false;
                termsCheckbox.checked = false; // Uncheck it when toggling back
            }
        });

        // Handle Forgot Password
        forgotPasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) {
                showError("Please type your email address in the field above to reset your password.");
                return;
            }
            
            sendPasswordResetEmail(auth, email)
                .then(() => {
                    showSuccess("Password reset link sent! Please check your email.");
                })
                .catch((error) => {
                    showError("Error: " + error.message);
                });
        });

        // Handle Form Submit
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Terms & Conditions Check
            if (isSignUpMode && !termsCheckbox.checked) {
                showError("You must agree to the Terms and Conditions to create an account.");
                return;
            }

            mainSubmitBtn.disabled = true;
            mainSubmitBtn.innerText = "Processing...";
            
            if (isSignUpMode) {
                const fName = document.getElementById('fNameInput').value.trim();
                const lName = document.getElementById('lNameInput').value.trim();
                const dob = document.getElementById('dobInput').value;
                const phone = document.getElementById('phoneInput').value.trim();
                const requestedUsername = usernameSignupInput.value.trim();

                // 1. PROFANITY CHECK
                if (containsProfanity(requestedUsername)) {
                    showError("Please choose a family-friendly username.");
                    mainSubmitBtn.disabled = false;
                    mainSubmitBtn.innerText = "Create Account";
                    return;
                }

                try {
                    // 2. UNIQUE USERNAME CHECK
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("username", "==", requestedUsername));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        showError("That username is already taken. Please pick another one.");
                        mainSubmitBtn.disabled = false;
                        mainSubmitBtn.innerText = "Create Account";
                        return; 
                    }

                    // 3. CREATE ACCOUNT
                    const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                    const user = userCredential.user;
                    
                    // 4. CREATE PROFILE IN FIRESTORE
                    await setDoc(doc(db, "users", user.uid), {
                        firstName: fName,
                        lastName: lName,
                        username: requestedUsername,
                        dob: dob,
                        phone: phone,
                        email: user.email,
                        role: "fan",
                        managedTeam: "", // Acts as a blank placeholder for future admin upgrades
                        points: 0,
                        followedTeams: []
                    });

                    // 5. SEND VERIFICATION EMAIL & FORCE LOGOUT
                    await sendEmailVerification(user);
                    await signOut(auth);

                    // Reset to Sign In Mode and show the Spam Warning Modal
                    toggleModeBtn.click();
                    window.openSpamModal();
                    
                    // Reset fields
                    passwordInput.value = "";
                    mainSubmitBtn.disabled = false;

                } catch (error) {
                    showError(error.message);
                    mainSubmitBtn.disabled = false;
                    mainSubmitBtn.innerText = "Create Account";
                }
            } else {
                signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                    .then(async (userCredential) => { 
                        // ENFORCE EMAIL VERIFICATION ON SIGN IN
                        if (!userCredential.user.emailVerified) {
                            await signOut(auth);
                            showError("Please verify your email address before logging in. Check your inbox or spam folder.");
                            mainSubmitBtn.disabled = false;
                            mainSubmitBtn.innerText = "Sign In";
                        } else {
                            window.location.href = "profile.html"; 
                        }
                    })
                    .catch(() => { 
                        showError("Invalid email or password.");
                        mainSubmitBtn.disabled = false;
                        mainSubmitBtn.innerText = "Sign In";
                    });
            }
        });
    </script>
</body>
</html>
