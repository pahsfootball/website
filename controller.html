<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Day Controller | PAHS Football</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { pahs: { dark: '#0f0f0f', card: '#18181b', gold: '#fbbf24' } },
                    fontFamily: { 'head': ['Teko', 'sans-serif'], 'body': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #e4e4e7; color: #18181b; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .input-box { background: #ffffff; border: 2px solid #d1d5db; transition: all 0.3s ease; }
        .input-box:focus { border-color: #fbbf24; outline: none; box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        .input-box[readonly] { background-color: #f3f4f6; color: #6b7280; cursor: not-allowed; border-color: #e5e7eb; }
        .dashboard-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 6px solid #fbbf24; overflow: hidden; }
        
        /* Custom Radio Buttons */
        .loc-radio:checked + label { background-color: #0f0f0f; color: #fbbf24; border-color: #0f0f0f; }
    </style>
</head>
<body class="antialiased pb-20">

    <nav class="bg-pahs-dark text-white shadow-xl sticky top-0 z-50 border-b border-white/10 py-4 px-4 sm:px-8">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="profile.html" class="group flex items-center gap-2 px-3 py-1.5 bg-white/5 hover:bg-pahs-gold text-white hover:text-black border border-white/10 hover:border-pahs-gold rounded-lg transition-all duration-300">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                    <span class="font-bold font-head text-lg pt-0.5 tracking-wide uppercase">Exit</span>
                </a>
                <h1 class="text-2xl sm:text-3xl font-bold font-head tracking-wide uppercase">Admin Controller</h1>
            </div>
            <div class="flex items-center gap-2 font-head text-2xl tracking-wide">
                <i class="fa-solid fa-sliders text-pahs-gold"></i>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-8">
        
        <div id="loadingState" class="text-center py-20">
            <i class="fa-solid fa-football fa-spin text-5xl text-pahs-gold mb-4"></i>
            <h2 class="font-head text-3xl uppercase tracking-widest text-gray-700">Verifying Access...</h2>
        </div>

        <div id="deniedState" class="hidden text-center py-20 bg-white rounded-2xl shadow-lg border-t-4 border-red-500 mt-10">
            <i class="fa-solid fa-lock text-6xl text-gray-300 mb-4"></i>
            <h2 class="font-head text-4xl uppercase tracking-widest text-gray-900 mb-2">Access Denied</h2>
            <p class="text-gray-600 font-body mb-6">You do not have manager privileges for any team.</p>
            <a href="profile.html" class="bg-pahs-dark text-pahs-gold font-bold font-head text-xl py-3 px-8 rounded-lg uppercase tracking-wider">Return to Profile</a>
        </div>

        <div id="adminDashboard" class="hidden space-y-6">
            
            <div class="bg-pahs-dark text-white rounded-xl p-6 shadow-lg flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-1">Managing Team</p>
                    <h2 id="managedTeamDisplay" class="font-head text-4xl text-pahs-gold tracking-wide m-0 leading-none">Loading...</h2>
                </div>
                <div id="myTeamLogoContainer" class="w-16 h-16 bg-white rounded-full flex items-center justify-center p-1 hidden border-2 border-pahs-gold">
                    <img id="myTeamLogo" src="" class="w-full h-full object-contain rounded-full">
                </div>
            </div>

            <form id="matchupForm" class="space-y-6">
                
                <div class="dashboard-card p-6 sm:p-8">
                    <h3 class="font-head text-2xl uppercase tracking-wide border-b border-gray-200 pb-2 mb-5 flex items-center gap-2">
                        <span class="bg-pahs-gold text-black w-6 h-6 rounded-full inline-flex items-center justify-center text-sm">1</span> Select Matchup
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Your Team's Current Record</label>
                            <input type="text" id="myTeamRecord" placeholder="e.g. 5-0" class="input-box w-full p-3 text-center text-xl font-bold rounded-lg" required>
                        </div>
                        
                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
                            <label class="block text-xs font-bold text-blue-600 uppercase tracking-widest mb-2">Select Opponent</label>
                            <div class="relative">
                                <input type="text" id="oppSelect" list="teamDirectoryList" placeholder="🔍 Search opponent..." class="input-box w-full p-3 font-bold rounded-lg mb-3" required autocomplete="off">
                                <datalist id="teamDirectoryList"></datalist>
                            </div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Opponent's Record</label>
                            <input type="text" id="oppRecord" placeholder="e.g. 4-1" class="input-box w-full p-3 text-center text-xl font-bold rounded-lg" required>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card p-6 sm:p-8">
                    <h3 class="font-head text-2xl uppercase tracking-wide border-b border-gray-200 pb-2 mb-5 flex items-center gap-2">
                        <span class="bg-pahs-gold text-black w-6 h-6 rounded-full inline-flex items-center justify-center text-sm">2</span> Game Info
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Date</label>
                            <input type="date" id="gameDate" class="input-box w-full p-3 rounded-lg font-bold" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Time</label>
                            <input type="time" id="gameTime" class="input-box w-full p-3 rounded-lg font-bold" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Theme (Optional)</label>
                            <input type="text" id="gameTheme" placeholder="e.g. Blackout" class="input-box w-full p-3 rounded-lg font-bold">
                        </div>
                    </div>
                </div>

                <div class="dashboard-card p-6 sm:p-8">
                    <h3 class="font-head text-2xl uppercase tracking-wide border-b border-gray-200 pb-2 mb-5 flex items-center gap-2">
                        <span class="bg-pahs-gold text-black w-6 h-6 rounded-full inline-flex items-center justify-center text-sm">3</span> Location
                    </h3>

                    <div class="flex gap-2 mb-6">
                        <div class="flex-1">
                            <input type="radio" name="locationType" id="locHome" value="Home" class="loc-radio hidden" checked>
                            <label for="locHome" class="block w-full text-center p-3 border-2 border-gray-300 rounded-lg cursor-pointer font-bold text-gray-500 uppercase tracking-wider transition-colors hover:bg-gray-100">Home</label>
                        </div>
                        <div class="flex-1">
                            <input type="radio" name="locationType" id="locAway" value="Away" class="loc-radio hidden">
                            <label for="locAway" class="block w-full text-center p-3 border-2 border-gray-300 rounded-lg cursor-pointer font-bold text-gray-500 uppercase tracking-wider transition-colors hover:bg-gray-100">Away</label>
                        </div>
                        <div class="flex-1">
                            <input type="radio" name="locationType" id="locNeutral" value="Neutral" class="loc-radio hidden">
                            <label for="locNeutral" class="block w-full text-center p-3 border-2 border-gray-300 rounded-lg cursor-pointer font-bold text-gray-500 uppercase tracking-wider transition-colors hover:bg-gray-100">Neutral</label>
                        </div>
                    </div>

                    <div class="space-y-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Stadium / Field Name</label>
                            <input type="text" id="stadiumName" class="input-box w-full p-3 rounded-lg font-bold" required readonly>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Street Address, City, State, Zip</label>
                            <input type="text" id="stadiumAddress" class="input-box w-full p-3 rounded-lg font-bold" required readonly>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitGameBtn" class="w-full bg-pahs-dark text-pahs-gold font-head font-bold text-3xl uppercase tracking-widest py-4 rounded-xl shadow-xl hover:brightness-110 transition-all border-2 border-pahs-gold mt-4">
                    Publish Game Day
                </button>
                <div id="statusMessage" class="hidden text-center mt-4 font-bold text-lg uppercase tracking-wide"></div>

            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUYZtoan7SgDO6VUi3LT50wFPSMdObEfM",
            authDomain: "pahs-football.firebaseapp.com",
            projectId: "pahs-football",
            storageBucket: "pahs-football.firebasestorage.app",
            messagingSenderId: "260294523190",
            appId: "1:260294523190:web:b3963804702d2a03749b97"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const dbRealtime = getDatabase(app);

        // --- GLOBAL STATE ---
        let adminTeamName = "";
        let directoryData = [];
        let myTeamObj = null;
        let oppTeamObj = null;

        // --- HELPER TO SCRUB ASTERISKS FROM CSV DATA ---
        function cleanText(str) {
            if (!str) return "";
            return str.replace(/\*/g, '').trim(); 
        }

        // --- LOAD DIRECTORY CSV ---
        const MASTER_TEAMS_CSV = "https://docs.google.com/spreadsheets/d/1-FvaWHAtW6v690e0TLkMQPYMhUZ0dJ9kz6heqpCyfqo/gviz/tq?tqx=out:csv&sheet=TeamDirectory";
        
        Papa.parse(MASTER_TEAMS_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Map and clean headers based on user's exact structure
                directoryData = results.data.map(row => ({
                    school: cleanText(row['School']),
                    mascot: cleanText(row['Mascot'] || row['Team']),
                    logo: cleanText(row['Logo']),
                    field: cleanText(row['FieldName']),
                    address: cleanText(row['FieldLocation'] || row['City'])
                })).filter(t => t.school !== "");

                // Populate Datalist for Opponent Dropdown
                const datalist = document.getElementById('teamDirectoryList');
                directoryData.sort((a,b) => a.school.localeCompare(b.school)).forEach(team => {
                    const option = document.createElement('option');
                    option.value = team.school;
                    datalist.appendChild(option);
                });

                // If auth already resolved, initialize the form
                if (adminTeamName) initDashboard();
            }
        });

        // --- AUTH & ADMIN CHECK ---
        onAuthStateChanged(auth, async (user) => {
            const loading = document.getElementById('loadingState');
            const denied = document.getElementById('deniedState');
            const dash = document.getElementById('adminDashboard');

            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        if (data.role === 'admin' && data.managedTeam) {
                            adminTeamName = data.managedTeam;
                            document.getElementById('managedTeamDisplay').innerText = adminTeamName;
                            
                            loading.classList.add('hidden');
                            dash.classList.remove('hidden');
                            
                            // If CSV is already loaded, init form
                            if (directoryData.length > 0) initDashboard();
                        } else {
                            loading.classList.add('hidden'); denied.classList.remove('hidden');
                        }
                    } else {
                        loading.classList.add('hidden'); denied.classList.remove('hidden');
                    }
                } catch(e) {
                    console.error(e);
                    loading.innerHTML = "Error checking permissions.";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // --- INIT DASHBOARD LOGIC ---
        function initDashboard() {
            // 1. Find Admin's Team in Directory
            myTeamObj = directoryData.find(t => t.school.toLowerCase() === adminTeamName.toLowerCase());
            
            if (myTeamObj && myTeamObj.logo) {
                const logoEl = document.getElementById('myTeamLogo');
                logoEl.src = myTeamObj.logo;
                document.getElementById('myTeamLogoContainer').classList.remove('hidden');
            }

            // 2. Set Initial Location (Defaults to Home)
            updateLocationFields();
        }

        // --- OPPONENT SELECTION LISTENER ---
        document.getElementById('oppSelect').addEventListener('input', function(e) {
            const selectedSchool = e.target.value.trim();
            oppTeamObj = directoryData.find(t => t.school.toLowerCase() === selectedSchool.toLowerCase());
            
            // Auto-trigger location update in case "Away" is selected
            updateLocationFields();
        });

        // --- LOCATION RADIO LISTENER ---
        document.querySelectorAll('input[name="locationType"]').forEach(radio => {
            radio.addEventListener('change', updateLocationFields);
        });

        function updateLocationFields() {
            const stadiumInput = document.getElementById('stadiumName');
            const addressInput = document.getElementById('stadiumAddress');
            const locType = document.querySelector('input[name="locationType"]:checked').value;

            if (locType === 'Home') {
                stadiumInput.value = myTeamObj ? myTeamObj.field : "Not found in directory";
                addressInput.value = myTeamObj ? myTeamObj.address : "Not found in directory";
                stadiumInput.setAttribute('readonly', true);
                addressInput.setAttribute('readonly', true);
            } else if (locType === 'Away') {
                stadiumInput.value = oppTeamObj ? oppTeamObj.field : (document.getElementById('oppSelect').value ? "Not found in directory" : "Select an opponent first");
                addressInput.value = oppTeamObj ? oppTeamObj.address : "Select an opponent first";
                stadiumInput.setAttribute('readonly', true);
                addressInput.setAttribute('readonly', true);
            } else if (locType === 'Neutral') {
                stadiumInput.value = "";
                addressInput.value = "";
                stadiumInput.removeAttribute('readonly');
                addressInput.removeAttribute('readonly');
                stadiumInput.focus();
            }
        }

        // --- SUBMIT GAME DAY CONFIG TO FIREBASE ---
        document.getElementById('matchupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitGameBtn');
            const msg = document.getElementById('statusMessage');
            
            btn.innerText = "Publishing...";
            btn.disabled = true;
            btn.classList.add('opacity-70');

            // Collect Data
            const oppName = document.getElementById('oppSelect').value.trim();
            if (!oppName) {
                alert("Please select an opponent.");
                btn.innerText = "Publish Game Day"; btn.disabled = false; btn.classList.remove('opacity-70'); return;
            }

            // Explicitly cast to Strings to prevent Firebase 'undefined' crashes
            const payload = {
                yourTeam: String(adminTeamName),
                yourTeamMascot: String(myTeamObj ? myTeamObj.mascot : ""),
                yourTeamLogo: String(myTeamObj ? myTeamObj.logo : ""),
                yourTeamRecord: String(document.getElementById('myTeamRecord').value.trim()),
                
                opponent: String(oppName),
                oppMascot: String(oppTeamObj ? oppTeamObj.mascot : ""),
                oppLogo: String(oppTeamObj ? oppTeamObj.logo : ""),
                oppRecord: String(document.getElementById('oppRecord').value.trim()),
                
                date: String(document.getElementById('gameDate').value),
                time: String(document.getElementById('gameTime').value),
                theme: String(document.getElementById('gameTheme').value.trim() || "No Theme"),
                
                homeAway: String(document.querySelector('input[name="locationType"]:checked').value),
                stadium: String(document.getElementById('stadiumName').value.trim()),
                address: String(document.getElementById('stadiumAddress').value.trim()),
                
                status: "UPCOMING",
                lastUpdated: new Date().toISOString()
            };

            try {
                // 1. Save Matchup to 'gameday_config'
                const safeKey = adminTeamName.toUpperCase().replace(/[^A-Z0-9]/g, '');
                const configRef = ref(dbRealtime, 'gameday_config/' + safeKey);
                await set(configRef, payload);

                // 2. Initialize the Scoreboard to 0-0 in 'live_scores'
                const isHome = payload.homeAway.toLowerCase() === 'home';
                const hName = (isHome ? payload.yourTeam : payload.opponent).replace(/[^a-zA-Z0-9]/g, '');
                const aName = (isHome ? payload.opponent : payload.yourTeam).replace(/[^a-zA-Z0-9]/g, '');
                const gameKey = [hName, aName].sort().join('_');
                
                const scoreRef = ref(dbRealtime, 'live_scores/' + gameKey);
                
                // We use update here so we don't accidentally overwrite an active score 
                // if they are just fixing a typo in the controller.
                await update(scoreRef, {
                    home: isHome ? payload.yourTeam : payload.opponent,
                    away: !isHome ? payload.yourTeam : payload.opponent,
                    homeLogo: isHome ? payload.yourTeamLogo : payload.oppLogo,
                    awayLogo: !isHome ? payload.yourTeamLogo : payload.oppLogo,
                    status: "UPCOMING",
                    quarter: "PREGAME"
                });

                msg.innerText = "Game Day Published Successfully!";
                msg.classList.replace('text-red-500', 'text-green-500');
                msg.classList.remove('hidden');

                setTimeout(() => {
                    msg.classList.add('hidden');
                    btn.innerText = "Publish Game Day";
                    btn.disabled = false;
                    btn.classList.remove('opacity-70');
                }, 3000);

            } catch (err) {
                console.error(err);
                // Reveal exact error to user for debugging Firebase Rules
                msg.innerText = "Error: " + err.message;
                msg.classList.replace('text-green-500', 'text-red-500');
                msg.classList.remove('hidden');
                
                btn.innerText = "Publish Game Day";
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        });
    </script>
</body>
</html>
