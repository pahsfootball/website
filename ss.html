<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAHS Football | Live Scores</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pahs: { dark: '#0f0f0f', gold: '#fbbf24' }
                    },
                    fontFamily: {
                        'head': ['Teko', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #adadad; 
            font-family: 'Inter', sans-serif; 
            color: #18181b; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
        }
        
        .content-card { 
            background-color: #f4f4f5; 
            border: 1px solid rgba(0, 0, 0, 0.1); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); 
        }
    </style>
</head>
<body class="antialiased">

    <nav class="bg-pahs-dark text-white shadow-xl sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="livescoreboards.html" class="group flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-pahs-gold text-white hover:text-black border border-white/10 hover:border-pahs-gold rounded-lg transition-all duration-300">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="font-bold font-head text-lg pt-0.5 tracking-wide uppercase">Back</span>
                </a>
                <h1 class="text-3xl font-bold font-head tracking-wide hidden sm:block uppercase">Live Scores</h1>
            </div>
            <div class="flex items-center gap-2 font-head text-2xl tracking-wide">
                <i class="fa-solid fa-football text-pahs-gold"></i>
                <span class="font-bold">PAHS<span class="text-pahs-gold">Football</span></span>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <div class="content-card rounded-2xl p-6">
            <h3 class="font-head text-3xl uppercase tracking-wide border-b border-gray-300 pb-2 mb-6 flex items-center gap-2 text-gray-900">
                <i class="fa-solid fa-list-ol text-pahs-gold drop-shadow-sm"></i> Statewide Scoreboard
            </h3>
            
            <div class="scoreboard-container w-full rounded-xl overflow-hidden border border-gray-300 bg-white shadow-inner">
                <div class="scorestream-widget-container"
                     data-ss_widget_type="vertScoreboard"
                     style="height:600px;"
                     data-user-widget-id="58320">
                </div>
                <script async="async" type="text/javascript" src="https://scorestream.com/apiJsCdn/widgets/embed.js"></script>
            </div>
            
        </div>

    </main>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // Your Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDUYZtoan7SgDO6VUi3LT50wFPSMdObEfM",
        authDomain: "pahs-football.firebaseapp.com",
        projectId: "pahs-football",
        storageBucket: "pahs-football.firebasestorage.app",
        messagingSenderId: "260294523190",
        appId: "1:260294523190:web:b3963804702d2a03749b97",
        measurementId: "G-2J69C1LS6D"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // This listens for login state changes
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // User IS logged in
            console.log("Welcome back, " + user.email);
            // Example: Change a "Login" button to say "My Account" or "Logout"
            // document.getElementById("navLoginBtn").innerText = "Logout";
        } else {
            // User is NOT logged in
            console.log("No user is logged in.");
            // Example: If this is a protected page, kick them back to login
            // window.location.href = "login.html";
        }
    });

    // Optional: A function to log the user out if you add a logout button
    window.logoutUser = function() {
        signOut(auth).then(() => {
            window.location.href = "login.html";
        }).catch((error) => {
            console.error("Logout Error", error);
        });
    }
</script>
</body>
</html>
