<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statewide Scoreboards | PAHSFootball</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { pahs: { dark: '#0f0f0f', gold: '#fbbf24' } },
                    fontFamily: { 'head': ['Teko', 'sans-serif'], 'body': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #adadad; font-family: 'Inter', sans-serif; color: #18181b; min-height: 100vh; }
        .content-card { background-color: #f4f4f5; border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        .pulse-live { animation: pulseLive 2s infinite; }
        @keyframes pulseLive { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }

        /* --- SCORE UPDATE ANIMATIONS --- */
        @keyframes scoreUpdateAnim {
            0% { border-color: #fbbf24; box-shadow: 0 0 25px rgba(251,191,36,0.9); transform: scale(1.03); }
            15% { border-color: #ef4444; box-shadow: 0 0 35px rgba(239,68,68,1); transform: scale(1.04); }
            50% { border-color: #fbbf24; box-shadow: 0 0 25px rgba(251,191,36,0.9); transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .anim-score-update {
            animation: scoreUpdateAnim 3.5s ease-out forwards;
            z-index: 40;
        }
        
        @keyframes fadeOutDelayed {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        .animate-fade-out-delayed {
            animation: fadeOutDelayed 3.5s forwards;
        }
    </style>
</head>
<body class="antialiased">

    <nav class="bg-pahs-dark text-white shadow-xl sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="teams.html" class="group flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-pahs-gold text-white hover:text-black border border-white/10 hover:border-pahs-gold rounded-lg transition-all duration-300">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="font-bold font-head text-lg pt-0.5 tracking-wide uppercase">Back</span>
                </a>
                <h1 class="text-3xl font-bold font-head tracking-wide hidden sm:block uppercase">Statewide Scores</h1>
            </div>
            <div class="flex items-center gap-2 font-head text-2xl tracking-wide">
                <i class="fa-solid fa-list-ol text-pahs-gold"></i>
                <span class="font-bold">PAHS<span class="text-pahs-gold">Football</span></span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="text-center mb-10">
            <h2 class="font-head text-5xl uppercase tracking-wide text-gray-900 drop-shadow-sm">Live GameDay Action</h2>
            <p class="text-gray-700 font-medium max-w-2xl mx-auto mt-2">Real-time scores updated by fans in the stands. Click a team's logo to view their full Game Day page.</p>
        </div>

        <div id="scoreboards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loading-state" class="col-span-full text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-5xl text-pahs-gold mb-4"></i>
                <h3 class="font-head text-2xl text-gray-700 uppercase tracking-widest">Fetching Matchups...</h3>
            </div>
        </div>

        <div class="mt-16 pt-10 border-t-4 border-pahs-gold max-w-4xl mx-auto">
            <div class="text-center mb-6">
                <h2 class="font-head text-4xl uppercase tracking-wide text-gray-900 drop-shadow-sm">Other PAHS Scores</h2>
                <p class="text-gray-700 font-medium">Powered by ScoreStream</p>
            </div>
            <div class="scorestream-widget-container bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200" data-ss_widget_type="vertScoreboard" style="height:600px;" data-user-widget-id="58320"></div>
            <script async="async" type="text/javascript" src="https://scorestream.com/apiJsCdn/widgets/embed.js"></script>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const SCHEDULE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdWZKFhp8YwMBw1YKke3rI8aZCQbE1F8tXW4Xc6hO6AllvOfYR7tFkNXEFFns_fRAL1E6AxY2qZYTK/pub?gid=1967283885&single=true&output=csv";
        const MASTER_TEAMS_CSV = "https://docs.google.com/spreadsheets/d/1-FvaWHAtW6v690e0TLkMQPYMhUZ0dJ9kz6heqpCyfqo/gviz/tq?tqx=out:csv&sheet=TeamDirectory"; 

        const firebaseConfig = {
            apiKey: "AIzaSyDUYZtoan7SgDO6VUi3LT50wFPSMdObEfM",
            authDomain: "pahs-football.firebaseapp.com",
            databaseURL: "https://pahs-football-default-rtdb.firebaseio.com/", 
            projectId: "pahs-football",
            storageBucket: "pahs-football.firebasestorage.app",
            messagingSenderId: "260294523190",
            appId: "1:260294523190:web:b3963804702d2a03749b97"
        };

        const app = initializeApp(firebaseConfig);
        const dbRealtime = getDatabase(app);

        const container = document.getElementById('scoreboards-container');
        const loadingState = document.getElementById('loading-state');
        
        let baseScheduleGames = {}; 
        let previousScores = {}; 
        let isFirstLoad = true;  
        let globalTeamDict = {}; 

        const formatTeamUrl = (teamName) => {
            if (!teamName) return '#';
            return `gameday.html?team=${encodeURIComponent(teamName.trim())}`;
        };

        function formatGameTime(timeStr) {
            if (!timeStr || timeStr === "undefined") return "7:00 PM";
            if (timeStr.toLowerCase().includes('am') || timeStr.toLowerCase().includes('pm')) return timeStr;
            try {
                let [hh, mm] = timeStr.split(':');
                let h = parseInt(hh);
                let ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12 || 12;
                return `${h}:${mm} ${ampm}`;
            } catch(e) { return timeStr; }
        }

        function formatGameDate(dateStr) {
            if (!dateStr || dateStr === "undefined") return "PREGAME";
            try {
                let [y, m, d] = dateStr.split('-');
                let dObj = new Date(y, m - 1, d);
                if (!isNaN(dObj)) {
                    return `${dObj.getMonth()+1}/${dObj.getDate()}/${dObj.getFullYear().toString().slice(-2)}`;
                }
            } catch(e) {}
            return dateStr;
        }

        // --- ENHANCED POP-OUT SCOREBOARD WINDOW LOGIC ---
        window.popoutScoreboard = function(homeEnc, awayEnc, gameKey, homeLogoEnc, awayLogoEnc, homeClassEnc, awayClassEnc) {
            const home = decodeURIComponent(homeEnc);
            const away = decodeURIComponent(awayEnc);
            const homeLogo = decodeURIComponent(homeLogoEnc);
            const awayLogo = decodeURIComponent(awayLogoEnc);
            const homeClass = decodeURIComponent(homeClassEnc);
            const awayClass = decodeURIComponent(awayClassEnc);

            const w = 480, h = 300; 
            const left = (screen.width/2)-(w/2);
            const top = (screen.height/2)-(h/2);
            const pop = window.open('', `sb_${gameKey}`, `width=${w},height=${h},top=${top},left=${left},resizable=yes,scrollbars=no`);
            
            const homeLogoHtml = homeLogo 
                ? `<img src="${homeLogo}" alt="${home}" class="w-full h-full object-contain p-1">`
                : `<span class="font-bold text-lg text-gray-500 uppercase">${home.substring(0,3)}</span>`;
            
            const awayLogoHtml = awayLogo 
                ? `<img src="${awayLogo}" alt="${away}" class="w-full h-full object-contain p-1">`
                : `<span class="font-bold text-lg text-gray-500 uppercase">${away.substring(0,3)}</span>`;

            const homeClassHtml = homeClass ? `<span class="text-[10px] text-gray-400 font-bold ml-1 align-top">${homeClass}</span>` : '';
            const awayClassHtml = awayClass ? `<span class="text-[10px] text-gray-400 font-bold ml-1 align-top">${awayClass}</span>` : '';

            pop.document.open();
            pop.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${home} vs ${away} - Live Tracker</title>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                    <script>
                        tailwind.config = {
                            theme: { extend: { colors: { pahs: { dark: '#0f0f0f', gold: '#fbbf24' } }, fontFamily: { 'head': ['Teko', 'sans-serif'], 'body': ['Inter', 'sans-serif'] } } }
                        }
                    <\/script>
                    <style>
                        body { background-color: #adadad; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
                        .content-card { background-color: #f4f4f5; border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); width: 100%; max-width: 450px; }
                        .pulse-live { animation: pulseLive 2s infinite; }
                        @keyframes pulseLive { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
                        
                        @keyframes scoreUpdateAnim {
                            0% { border-color: #fbbf24; box-shadow: 0 0 25px rgba(251,191,36,0.9); transform: scale(1.03); }
                            15% { border-color: #ef4444; box-shadow: 0 0 35px rgba(239,68,68,1); transform: scale(1.04); }
                            50% { border-color: #fbbf24; box-shadow: 0 0 25px rgba(251,191,36,0.9); transform: scale(1.02); }
                            100% { transform: scale(1); }
                        }
                        .anim-score-update { animation: scoreUpdateAnim 3.5s ease-out forwards; z-index: 40; }
                        
                        @keyframes fadeOutDelayed { 0%, 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
                        .animate-fade-out-delayed { animation: fadeOutDelayed 3.5s forwards; }
                    </style>
                </head>
                <body>
                    <div id="card-container" class="content-card rounded-2xl p-5 border-2 border-gray-200 shadow-sm flex flex-col relative bg-white transition-all duration-300">
                        <div id="update-overlay" style="display:none;" class="absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center rounded-2xl font-head text-4xl text-red-600 pointer-events-none border-4 border-pahs-gold shadow-2xl">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-bolt text-yellow-500 animate-pulse"></i> 
                                <span id="update-text">SCORE UPDATE!</span>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-3 relative z-10">
                            <div class="flex items-center gap-2">
                                <div id="dot-class" class="hidden"></div>
                                <span class="font-head text-xl uppercase tracking-wide text-gray-800 line-clamp-1">Matchup</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span id="badge-text" class="bg-gray-200 text-gray-800 border border-gray-300 text-[10px] font-bold px-2 py-0.5 rounded shadow uppercase tracking-widest">PREGAME</span>
                                <span id="clock-text" class="font-mono font-bold text-xs text-gray-600">TBA</span>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center px-2 flex-grow relative z-10">
                            <div class="flex flex-col items-center w-5/12">
                                <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center border border-gray-300 shadow-sm mb-2 overflow-hidden transition-colors duration-200 border-pahs-gold shadow-md">
                                    ${homeLogoHtml}
                                </div>
                                <span class="font-head text-xl uppercase text-center leading-tight line-clamp-2 text-pahs-gold">${home}${homeClassHtml}</span>
                                <span id="home-score" class="text-5xl font-mono font-black mt-1 text-gray-900">0</span>
                            </div>
                            <div class="text-3xl font-black text-gray-300 w-2/12 text-center">-</div>
                            <div class="flex flex-col items-center w-5/12">
                                <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center border border-gray-300 shadow-sm mb-2 overflow-hidden transition-colors duration-200 border-pahs-gold shadow-md">
                                    ${awayLogoHtml}
                                </div>
                                <span class="font-head text-xl uppercase text-center leading-tight line-clamp-2 text-pahs-gold">${away}${awayClassHtml}</span>
                                <span id="away-score" class="text-5xl font-mono font-black mt-1 text-gray-900">0</span>
                            </div>
                        </div>
                        
                        <div class="text-center mt-5 pt-3 border-t border-gray-100 flex justify-between items-center px-1 relative z-10">
                            <div class="text-[10px] uppercase tracking-widest text-gray-500 text-left">
                                <i class="fa-solid fa-user-pen text-pahs-gold mr-1"></i> <span class="font-bold text-gray-800" id="updated-by">@System</span>
                            </div>
                            <div class="text-[10px] uppercase tracking-widest text-gray-400 text-right" id="updated-time">
                                <i class="fa-solid fa-circle text-green-500 animate-pulse mr-1"></i> Live Connection
                            </div>
                        </div>
                    </div>

                    <!-- USE COMPAT FIREBASE FOR POP-UP SO CORS/MODULE ISSUES DO NOT BREAK IT -->
                    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"><\/script>
                    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"><\/script>
                    <script>
                        firebase.initializeApp(${JSON.stringify(firebaseConfig)});
                        const db = firebase.database();
                        
                        let prevH = null, prevA = null;
                        
                        function formatGameTime(timeStr) {
                            if (!timeStr || !timeStr.includes(':')) return timeStr || "TBA";
                            try {
                                let [hh, mm] = timeStr.split(':');
                                let h = parseInt(hh);
                                let ampm = h >= 12 ? 'PM' : 'AM';
                                h = h % 12 || 12;
                                return \`\${h}:\${mm} \${ampm}\`;
                            } catch(e) { return timeStr; }
                        }

                        function formatGameDate(dateStr) {
                            if (!dateStr) return "PREGAME";
                            try {
                                let [y, m, d] = dateStr.split('-');
                                let dObj = new Date(y, m - 1, d);
                                if (!isNaN(dObj)) return \`\${dObj.getMonth()+1}/\${dObj.getDate()}/\${dObj.getFullYear().toString().slice(-2)}\`;
                            } catch(e) {}
                            return "PREGAME";
                        }

                        db.ref('live_scores/' + '${gameKey}').on('value', (snap) => {
                            const game = snap.val();
                            if (!game) return;

                            const card = document.getElementById('card-container');
                            const updateOverlay = document.getElementById('update-overlay');
                            const updateText = document.getElementById('update-text');
                            const hScore = document.getElementById('home-score');
                            const aScore = document.getElementById('away-score');
                            const badgeText = document.getElementById('badge-text');
                            const clockText = document.getElementById('clock-text');
                            const dotClass = document.getElementById('dot-class');
                            
                            let currH = game.homeScore || 0;
                            let currA = game.awayScore || 0;
                            let pointsAdded = 0;
                            let justUpdated = false;

                            if (prevH !== null && prevA !== null) {
                                if (currH !== prevH || currA !== prevA) {
                                    justUpdated = true;
                                    pointsAdded = Math.max(currH - prevH, currA - prevA);
                                }
                            }
                            prevH = currH;
                            prevA = currA;

                            hScore.innerText = currH;
                            aScore.innerText = currA;

                            let qtr = game.quarter;
                            if (!qtr || qtr === "undefined" || qtr === "") qtr = "PREGAME";
                            
                            let stat = game.status;
                            if (!stat || stat === "undefined" || stat === "") stat = "UPCOMING";

                            const statusUpper = stat.toUpperCase();
                            const qtrUpper = qtr.toUpperCase();

                            let bText = "", bClass = "", dClass = "hidden", cBorder = "border-gray-300 shadow-md", cHtml = "";

                            if (statusUpper === "PREGAME" || statusUpper === "UPCOMING" || qtrUpper === "PREGAME") {
                                bText = game.date ? formatGameDate(game.date) : "PREGAME";
                                bClass = "bg-gray-200 text-gray-800 border border-gray-300 font-bold";
                                cBorder = "border-gray-200 shadow-sm";
                                let timeStr = game.time ? formatGameTime(game.time) : "TBA";
                                cHtml = \`<span class="font-mono font-bold text-xs text-gray-600">\${timeStr}</span>\`;
                            } else if (qtrUpper === "HALF") {
                                bText = "HALFTIME";
                                bClass = "bg-yellow-600 text-black";
                                dClass = "w-2.5 h-2.5 rounded-full bg-red-600 pulse-live";
                                cBorder = "border-red-500 shadow-[0_0_15px_rgba(220,38,38,0.3)]";
                            } else if (statusUpper === "FINAL" || qtrUpper === "FINAL") {
                                bText = "FINAL";
                                bClass = "bg-gray-800 text-white";
                                cBorder = "border-gray-400 shadow-sm opacity-80";
                                cHtml = "";
                            } else {
                                bText = qtrUpper.includes("QTR") ? qtrUpper : "QTR " + qtrUpper;
                                bClass = "bg-red-600 text-white animate-pulse";
                                dClass = "w-2.5 h-2.5 rounded-full bg-red-600 pulse-live";
                                cBorder = "border-red-600 shadow-[0_0_20px_rgba(220,38,38,0.4)]";
                                let cText = game.clock || "12:00";
                                if(cText === "undefined" || cText.trim() === "") cText = "12:00";
                                cHtml = \`<span class="font-mono font-bold text-sm text-red-600 animate-pulse">\${cText}</span>\`;
                            }

                            badgeText.className = bClass + " text-[10px] font-bold px-2 py-0.5 rounded shadow uppercase tracking-widest";
                            badgeText.innerText = bText;
                            clockText.outerHTML = \`<span id="clock-text" class="flex items-center">\${cHtml}</span>\`;
                            dotClass.className = dClass;

                            // Triggers the big score flash animation
                            if (justUpdated) {
                                card.className = \`content-card rounded-2xl p-5 border-2 \${cBorder} flex flex-col relative bg-white transition-all duration-300 anim-score-update\`;
                                updateText.innerText = pointsAdded > 0 ? \`+\${pointsAdded} SCORE UPDATE!\` : "SCORE UPDATE!";
                                updateOverlay.style.display = "flex";
                                
                                updateOverlay.classList.remove('animate-fade-out-delayed');
                                void updateOverlay.offsetWidth;
                                updateOverlay.classList.add('animate-fade-out-delayed');

                                setTimeout(() => {
                                    updateOverlay.style.display = "none";
                                    card.classList.remove('anim-score-update');
                                }, 3500);
                            } else {
                                card.className = \`content-card rounded-2xl p-5 border-2 \${cBorder} flex flex-col relative bg-white transition-all duration-300\`;
                            }

                            document.getElementById('updated-by').innerText = "@" + (game.updatedBy || "System");
                        });
                    <\/script>
                </body>
                </html>
            `);
            pop.document.close();
        };

        // Parse Master Teams CSV
        Papa.parse(MASTER_TEAMS_CSV, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(masterResults) {
                masterResults.data.forEach(row => {
                    const teamName = row['School'] || row['Team Name'] || row['Team'];
                    const logoUrl = row['Logo'] || row['Logo URL'] || row['LogoUrl'];
                    const teamClass = row['Class'] || "";
                    
                    if (teamName) {
                        globalTeamDict[teamName.trim().toLowerCase()] = {
                            logo: logoUrl ? logoUrl.trim() : '',
                            classification: teamClass.trim()
                        };
                    }
                });

                // Now load the base schedule
                Papa.parse(SCHEDULE_CSV_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const games = results.data;
                        
                        games.forEach(game => {
                            if (!game.HomeTeam || !game.AwayTeam) return;

                            const homeNameStr = game.HomeTeam.replace(/[^a-zA-Z0-9]/g, '');
                            const awayNameStr = game.AwayTeam.replace(/[^a-zA-Z0-9]/g, '');
                            const gameKey = [homeNameStr, awayNameStr].sort().join('_');

                            baseScheduleGames[gameKey] = {
                                id: gameKey,
                                home: game.HomeTeam,
                                away: game.AwayTeam,
                                homeLogo: game.HomeLogo || "",
                                awayLogo: game.AwayLogo || "",
                                homeScore: 0,
                                awayScore: 0,
                                status: "PREGAME",
                                quarter: "PREGAME",
                                clock: game.Time || "12:00",
                                date: game.Date || "", 
                                time: game.Time || "", 
                                updatedBy: "Schedule",
                                lastUpdated: new Date(0).toISOString() 
                            };
                        });

                        startFirebaseListener();
                    },
                    error: function(err) {
                        console.error("Error loading schedule CSV", err);
                        startFirebaseListener(); 
                    }
                });
            }
        });

        async function startFirebaseListener() {
            // Also fetch gameday_config to cross-reference missing dates/times
            let gamedayConfigs = {};
            try {
                const configSnap = await get(ref(dbRealtime, 'gameday_config'));
                if (configSnap.exists()) gamedayConfigs = configSnap.val();
            } catch(e) { console.error(e); }

            onValue(ref(dbRealtime, 'live_scores'), (snapshot) => {
                const liveData = snapshot.val() || {};
                const mergedGamesArray = [];
                const tempGamesMap = { ...baseScheduleGames };

                for (let teamKey in liveData) {
                    const liveGame = liveData[teamKey];
                    if (liveGame.home && liveGame.away) {
                        tempGamesMap[teamKey] = { 
                            ...tempGamesMap[teamKey], 
                            ...liveGame, 
                            id: teamKey 
                        };
                    }
                }

                for (let key in tempGamesMap) {
                    const game = tempGamesMap[key];
                    game.justUpdated = false;
                    game.pointsAdded = 0;

                    // Cross-reference date/time from gameday_config if missing in live_scores
                    if (!game.date || !game.time) {
                        const homeKey = game.home.toUpperCase().replace(/[^A-Z0-9]/g, '');
                        const conf = gamedayConfigs[homeKey];
                        if (conf) {
                            if (!game.date && conf.date) game.date = conf.date;
                            if (!game.time && conf.time) game.time = conf.time;
                        }
                    }

                    if (!isFirstLoad && previousScores[key]) {
                        const prevH = previousScores[key].homeScore || 0;
                        const prevA = previousScores[key].awayScore || 0;
                        const currH = game.homeScore || 0;
                        const currA = game.awayScore || 0;

                        if (currH !== prevH || currA !== prevA) {
                            game.justUpdated = true;
                            game.pointsAdded = Math.max(currH - prevH, currA - prevA);
                        }
                    }
                    previousScores[key] = { homeScore: game.homeScore || 0, awayScore: game.awayScore || 0 };
                    mergedGamesArray.push(game);
                }

                if (mergedGamesArray.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-12"><i class="fa-solid fa-ghost text-5xl text-gray-500 mb-4"></i><h3 class="font-head text-2xl text-gray-700 uppercase tracking-widest">No Active Games Found</h3><p class="text-gray-500">Wait for kickoff!</p></div>`;
                    isFirstLoad = false;
                    return;
                }

                mergedGamesArray.sort((a, b) => {
                    const getWeight = (status, quarter) => {
                        let s = (status || "").toUpperCase();
                        let q = (quarter || "").toUpperCase();
                        
                        if (!s || s === "UNDEFINED") s = "UPCOMING";
                        if (!q || q === "UNDEFINED") q = "PREGAME";

                        if (s === 'FINAL' || q === 'FINAL') return 4;
                        if (q === 'PREGAME' || s === 'UPCOMING' || s === 'PREGAME') return 3;
                        if (q === 'HALF') return 2;
                        return 1; // LIVE action
                    };
                    const weightA = getWeight(a.status, a.quarter);
                    const weightB = getWeight(b.status, b.quarter);
                    if (weightA !== weightB) return weightA - weightB;
                    return new Date(b.lastUpdated) - new Date(a.lastUpdated);
                });

                loadingState.style.display = 'none';
                container.innerHTML = ''; 

                mergedGamesArray.forEach(game => {
                    let badgeText = "";
                    let badgeClass = "";
                    let dotClass = "hidden";
                    let cardBorder = "border-gray-300 shadow-md";

                    let qtr = game.quarter;
                    if (!qtr || qtr === "undefined" || qtr === "") qtr = "PREGAME";
                    
                    let stat = game.status;
                    if (!stat || stat === "undefined" || stat === "") stat = "UPCOMING";

                    const statusUpper = stat.toUpperCase();
                    const qtrUpper = qtr.toUpperCase();

                    let clockHtml = "";

                    if (statusUpper === "PREGAME" || statusUpper === "UPCOMING" || qtrUpper === "PREGAME") {
                        let fDate = game.date ? formatGameDate(game.date) : "8/28/26";
                        let fTime = game.time ? formatGameTime(game.time) : "7:00 PM";
                        
                        badgeText = fDate;
                        badgeClass = "bg-gray-200 text-gray-800 border border-gray-300 font-bold"; 
                        cardBorder = "border-gray-200 shadow-sm";
                        clockHtml = `<span class="font-mono font-bold text-xs text-gray-600">${fTime}</span>`;
                    } else if (qtrUpper === "HALF") {
                        badgeText = "HALFTIME";
                        badgeClass = "bg-yellow-600 text-black";
                        dotClass = "w-2.5 h-2.5 rounded-full bg-red-600 pulse-live";
                        cardBorder = "border-red-500 shadow-[0_0_15px_rgba(220,38,38,0.3)]";
                    } else if (statusUpper === "FINAL" || qtrUpper === "FINAL") {
                        badgeText = "FINAL";
                        badgeClass = "bg-gray-800 text-white";
                        cardBorder = "border-gray-400 shadow-sm opacity-80"; 
                    } else {
                        badgeText = qtrUpper.includes("QTR") ? qtrUpper : "QTR " + qtrUpper;
                        badgeClass = "bg-red-600 text-white animate-pulse";
                        dotClass = "w-2.5 h-2.5 rounded-full bg-red-600 pulse-live";
                        cardBorder = "border-red-600 shadow-[0_0_20px_rgba(220,38,38,0.4)]";
                        let clockText = game.clock || "12:00";
                        if(clockText === "undefined" || clockText.trim() === "") clockText = "12:00";
                        clockHtml = `<span class="font-mono font-bold text-sm text-red-600 animate-pulse">${clockText}</span>`;
                    }

                    // Attach Logos and Classification
                    const safeHomeName = (game.home || '').trim().toLowerCase();
                    const safeAwayName = (game.away || '').trim().toLowerCase();

                    const homeData = globalTeamDict[safeHomeName] || {};
                    const awayData = globalTeamDict[safeAwayName] || {};

                    const finalHomeLogo = homeData.logo || game.homeLogo || '';
                    const finalAwayLogo = awayData.logo || game.awayLogo || '';

                    const homeClass = homeData.classification ? `<span class="text-[10px] text-gray-400 font-bold ml-1 align-top">${homeData.classification}</span>` : '';
                    const awayClass = awayData.classification ? `<span class="text-[10px] text-gray-400 font-bold ml-1 align-top">${awayData.classification}</span>` : '';

                    const homeLogoHtml = finalHomeLogo 
                        ? `<img src="${finalHomeLogo}" alt="${game.home}" class="w-full h-full object-contain p-1">`
                        : `<span class="font-bold text-lg text-gray-500 uppercase">${game.home.substring(0,3)}</span>`;
                    
                    const awayLogoHtml = finalAwayLogo 
                        ? `<img src="${finalAwayLogo}" alt="${game.away}" class="w-full h-full object-contain p-1">`
                        : `<span class="font-bold text-lg text-gray-500 uppercase">${game.away.substring(0,3)}</span>`;

                    let updatedText = "Unknown";
                    if (game.lastUpdated && game.updatedBy !== "Schedule") {
                        const diffMins = Math.floor((new Date() - new Date(game.lastUpdated)) / 60000);
                        if (diffMins < 1) updatedText = "Just now";
                        else if (diffMins === 1) updatedText = "1 min ago";
                        else if (diffMins < 60) updatedText = `${diffMins} mins ago`;
                        else updatedText = "Over an hour ago";
                    } else {
                        updatedText = "Scheduled"; 
                    }

                    const homeUrl = formatTeamUrl(game.home);
                    const awayUrl = formatTeamUrl(game.away);

                    let ptsNotice = game.pointsAdded > 0 ? `+${game.pointsAdded} ` : '';
                    let updateAnimClass = game.justUpdated ? "anim-score-update" : "";
                    let updateOverlayHtml = game.justUpdated ? `
                        <div class="absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center rounded-2xl font-head text-4xl text-red-600 animate-fade-out-delayed pointer-events-none border-4 border-pahs-gold shadow-2xl">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-bolt text-yellow-500 animate-pulse"></i> 
                                <span>${ptsNotice}SCORE UPDATE!</span>
                            </div>
                        </div>
                    ` : "";

                    const cardHTML = `
                        <div class="content-card rounded-2xl p-5 border-2 ${cardBorder} flex flex-col relative bg-white transition-all duration-300 ${updateAnimClass}">
                            ${updateOverlayHtml}
                            <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-3 relative z-10">
                                <div class="flex items-center gap-2">
                                    <div class="${dotClass}"></div>
                                    <span class="font-head text-xl uppercase tracking-wide text-gray-800 line-clamp-1">Matchup</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="popoutScoreboard('${encodeURIComponent(game.home)}', '${encodeURIComponent(game.away)}', '${game.id}', '${encodeURIComponent(finalHomeLogo)}', '${encodeURIComponent(finalAwayLogo)}', '${encodeURIComponent(homeData.classification || '')}', '${encodeURIComponent(awayData.classification || '')}')" title="Pop out scoreboard" class="text-[10px] bg-gray-100 hover:bg-pahs-gold hover:text-black border border-gray-300 font-bold px-2 py-0.5 rounded transition-colors flex items-center gap-1 uppercase mr-1">
                                        <i class="fa-solid fa-up-right-from-square"></i> Pop Out
                                    </button>
                                    <span class="${badgeClass} text-[10px] font-bold px-2 py-0.5 rounded shadow uppercase tracking-widest">${badgeText}</span>
                                    ${clockHtml}
                                </div>
                            </div>
                            <div class="flex justify-between items-center px-2 flex-grow relative z-10">
                                <a href="${homeUrl}" class="flex flex-col items-center w-5/12 cursor-pointer group transition-transform duration-200 hover:scale-105">
                                    <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center border border-gray-300 shadow-sm mb-2 overflow-hidden transition-colors duration-200 group-hover:border-pahs-gold group-hover:shadow-md">
                                        ${homeLogoHtml}
                                    </div>
                                    <span class="font-head text-xl uppercase text-center leading-tight line-clamp-2 transition-colors duration-200 group-hover:text-pahs-gold">${game.home}${homeClass}</span>
                                    <span class="text-5xl font-mono font-black mt-1 text-gray-900">${game.homeScore || 0}</span>
                                </a>
                                <div class="text-3xl font-black text-gray-300 w-2/12 text-center">-</div>
                                <a href="${awayUrl}" class="flex flex-col items-center w-5/12 cursor-pointer group transition-transform duration-200 hover:scale-105">
                                    <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center border border-gray-300 shadow-sm mb-2 overflow-hidden transition-colors duration-200 group-hover:border-pahs-gold group-hover:shadow-md">
                                        ${awayLogoHtml}
                                    </div>
                                    <span class="font-head text-xl uppercase text-center leading-tight line-clamp-2 transition-colors duration-200 group-hover:text-pahs-gold">${game.away}${awayClass}</span>
                                    <span class="text-5xl font-mono font-black mt-1 text-gray-900">${game.awayScore || 0}</span>
                                </a>
                            </div>
                            <div class="text-center mt-5 pt-3 border-t border-gray-100 flex justify-between items-center px-1 relative z-10">
                                <div class="text-[10px] uppercase tracking-widest text-gray-500 text-left">
                                    <i class="fa-solid fa-user-pen text-pahs-gold mr-1"></i> <span class="font-bold text-gray-800">@${game.updatedBy || "System"}</span>
                                </div>
                                <div class="text-[10px] uppercase tracking-widest text-gray-400 text-right">
                                    <i class="fa-regular fa-clock mr-1"></i> ${updatedText}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
                isFirstLoad = false;
            });
        }
    </script>
</body>
</html>
