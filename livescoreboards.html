<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statewide Teams | PAHS Football</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { pahs: { dark: '#0f0f0f', gold: '#fbbf24' } },
                    fontFamily: { 'head': ['Teko', 'sans-serif'], 'body': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #adadad; color: #18181b; font-family: 'Inter', sans-serif; min-height: 100vh; }
        
        .pulse-live {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
    </style>
</head>
<body class="bg-[#adadad] font-body text-[#18181b]">

    <nav class="bg-pahs-dark text-white p-4 sticky top-0 z-50 border-b border-white/10 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <a href="index.html" class="bg-white/10 hover:bg-pahs-gold hover:text-black p-2 rounded transition-all"><i class="fa-solid fa-arrow-left"></i></a>
                <h1 class="text-2xl font-head uppercase tracking-tighter">Statewide <span class="text-pahs-gold">Teams</span></h1>
            </div>

            <a href="all-scores.html" class="flex items-center gap-3 bg-pahs-gold text-black px-6 py-2 rounded-full font-head text-xl font-bold uppercase tracking-widest hover:brightness-110 transition-all shadow-lg hover:scale-105">
                <i class="fa-solid fa-tower-broadcast pulse-live text-red-600"></i>
                SEE PAHSFOOTBALL SCORES & LIVE GAMES
            </a>

            <div class="text-gray-400 font-head text-xl uppercase hidden md:block"><span id="count">0</span> Teams</div>
        </div>
    </nav>

    <div class="bg-pahs-dark p-6 shadow-lg border-b border-white/5">
        <div class="max-w-4xl mx-auto">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search for your team or mascot..." class="w-full pl-12 pr-4 py-4 rounded-xl text-lg font-bold outline-none focus:ring-4 focus:ring-pahs-gold/50 transition-all shadow-inner">
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto p-4 py-12">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20">
                <i class="fa-solid fa-football fa-spin text-4xl text-gray-600 mb-4"></i>
                <p class="font-head text-2xl uppercase text-gray-600">Loading PIAA Directory...</p>
            </div>
        </div>
    </main>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/1-FvaWHAtW6v690e0TLkMQPYMhUZ0dJ9kz6heqpCyfqo/gviz/tq?tqx=out:csv&sheet=TeamDirectory";
        let allTeams = [];

        const colorMap = {
            "white": "#FFFFFF", "black": "#000000", "gold": "#FFD700", "yellow": "#FFFF00", "red": "#EF4444", "blue": "#3B82F6",
            "green": "#22C55E", "purple": "#A855F7", "orange": "#F97316", "navy": "#1e3a8a", "navy blue": "#1e3a8a", "grey": "#64748b",
            "gray": "#64748b", "silver": "#94a3b8", "maroon": "#7f1d1d", "cardinal": "#991b1b", "crimson": "#be123c", "royal blue": "#2563eb",
            "kelly green": "#16a34a", "forest green": "#14532d", "vegas gold": "#eab308", "columbia blue": "#7dd3fc", "sky blue": "#0ea5e9",
            "brown": "#451a03", "teal": "#0d9488", "pink": "#f472b6", "old gold": "#ca8a04", "scarlet": "#dc2626", "dark green": "#14532d", "midnight blue": "#172554"
        };

        function clean(str) { return str ? str.replace(/\*/g, '').trim() : ""; }

        function getBestAccent(colorString) {
            if (!colorString) return "#fbbf24";
            const parts = colorString.split(/[&/,]+/).map(s => s.trim().toLowerCase());
            let primary = colorMap[parts[0]] || parts[0];
            let secondary = parts[1] ? (colorMap[parts[1]] || parts[1]) : primary;
            if (primary === "#000000" || primary.toLowerCase() === "black") {
                return secondary;
            }
            return primary;
        }

        function getContrastYIQ(hexcolor){
            if (!hexcolor || hexcolor.startsWith('rgb')) return 'black';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(s => s + s).join('');
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                allTeams = results.data.map(row => ({
                    school: clean(row['School']),
                    mascot: clean(row['Mascot']),
                    logo: clean(row['Logo']),
                    class: clean(row['Class']),
                    colors: clean(row['Colors'])
                })).filter(t => t.school !== "");
                
                allTeams.sort((a,b) => a.school.localeCompare(b.school));
                document.getElementById('count').innerText = allTeams.length;
                render(allTeams);
            }
        });

        function render(teams) {
            const grid = document.getElementById('grid');
            if (teams.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 font-bold text-gray-500">No teams found matching your search.</div>';
                return;
            }

            grid.innerHTML = teams.map(team => {
                const accent = getBestAccent(team.colors);
                const textColor = getContrastYIQ(accent);
                const badgeBg = textColor === 'black' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';

                return `
                <a href="gameday.html?team=${encodeURIComponent(team.school)}" class="block bg-white rounded-2xl overflow-hidden shadow-md hover:-translate-y-1 transition-all group" style="border-top: 6px solid ${accent}">
                    <div class="p-6 flex flex-col items-center text-center">
                        <div class="w-20 h-20 bg-gray-50 rounded-full border border-gray-200 flex items-center justify-center overflow-hidden mb-4 p-2 transition-transform group-hover:scale-110">
                            ${team.logo ? `<img src="${team.logo}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-shield text-gray-300 text-4xl"></i>`}
                        </div>
                        <h2 class="font-head text-3xl uppercase leading-none text-gray-900 group-hover:text-pahs-dark">${team.school}</h2>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mt-1">${team.mascot || 'Varsity Football'}</p>
                        
                        <div class="mt-4 flex items-center justify-center gap-2">
                            <span class="text-[10px] px-3 py-1 rounded-full font-black uppercase shadow-sm" style="background-color: ${accent}; color: ${textColor}">Class ${team.class || 'PIAA'}</span>
                        </div>
                    </div>
                    <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest border-t transition-colors" style="background-color: ${accent}; color: ${textColor}; border-color: ${badgeBg}">
                        View Game Day Page
                    </div>
                </a>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            render(allTeams.filter(t => t.school.toLowerCase().includes(val) || t.mascot.toLowerCase().includes(val)));
        });
    </script>
</body>
</html>
