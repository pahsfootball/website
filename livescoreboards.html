<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statewide Teams | PAHS Football</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { pahs: { dark: '#0f0f0f', gold: '#fbbf24' } },
                    fontFamily: { 'head': ['Teko', 'sans-serif'], 'body': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#adadad] font-body text-[#18181b]">

    <nav class="bg-pahs-dark text-white p-4 sticky top-0 z-50 border-b border-white/10 shadow-xl">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html" class="bg-white/10 hover:bg-pahs-gold hover:text-black p-2 rounded transition-all"><i class="fa-solid fa-arrow-left"></i></a>
                <h1 class="text-2xl font-head uppercase tracking-tighter">Statewide <span class="text-pahs-gold">Teams</span></h1>
            </div>
            <div class="text-gray-400 font-head text-xl uppercase"><span id="count">0</span> Teams</div>
        </div>
    </nav>

    <div class="bg-pahs-dark p-6 shadow-lg">
        <div class="max-w-4xl mx-auto">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search for your team..." class="w-full pl-12 pr-4 py-4 rounded-xl text-lg font-bold outline-none focus:ring-4 focus:ring-pahs-gold/50">
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto p-4 py-12">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/1-FvaWHAtW6v690e0TLkMQPYMhUZ0dJ9kz6heqpCyfqo/gviz/tq?tqx=out:csv&sheet=TeamDirectory";
        let allTeams = [];

        function clean(str) { return str ? str.replace(/\*/g, '').trim() : ""; }

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                allTeams = results.data.map(row => ({
                    school: clean(row['School']),
                    mascot: clean(row['Mascot']),
                    logo: clean(row['Logo']),
                    class: clean(row['Class'])
                })).filter(t => t.school !== "");
                
                allTeams.sort((a,b) => a.school.localeCompare(b.school));
                document.getElementById('count').innerText = allTeams.length;
                render(allTeams);
            }
        });

        function render(teams) {
            const grid = document.getElementById('grid');
            grid.innerHTML = teams.map(team => `
                <a href="gameday.html?team=${encodeURIComponent(team.school)}" class="block bg-white rounded-2xl overflow-hidden shadow-md hover:-translate-y-1 transition-all border-t-4 border-pahs-gold">
                    <div class="p-6 flex flex-col items-center text-center">
                        <div class="w-20 h-20 bg-gray-50 rounded-full border border-gray-200 flex items-center justify-center overflow-hidden mb-4 p-2">
                            ${team.logo ? `<img src="${team.logo}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-shield text-gray-300 text-4xl"></i>`}
                        </div>
                        <h2 class="font-head text-3xl uppercase leading-none text-gray-900">${team.school}</h2>
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mt-1">${team.mascot || 'Varsity Football'}</p>
                        <span class="mt-4 text-[10px] bg-pahs-dark text-pahs-gold px-3 py-1 rounded-full font-black uppercase">Class ${team.class || 'PIAA'}</span>
                    </div>
                    <div class="bg-gray-100 py-3 text-center text-[10px] font-black uppercase text-gray-400 tracking-widest border-t border-gray-200">View Game Day Page</div>
                </a>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            render(allTeams.filter(t => t.school.toLowerCase().includes(val) || t.mascot.toLowerCase().includes(val)));
        });
    </script>
</body>
</html>
