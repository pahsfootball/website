<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIAA Championship History | PAHSFootball</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>

    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pahs: {
                            dark: '#0f0f0f',
                            gold: '#fbbf24',
                        }
                    },
                    fontFamily: {
                        'head': ['Teko', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #adadad; /* Match Directory Background */
            font-family: 'Inter', sans-serif;
            color: #18181b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Loading / Error States */
        #loading-message {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #18181b; font-weight: bold; text-align: center;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #e4e4e7; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #a1a1aa; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #fbbf24; }

        /* Ticker Animation */
        .ticker-wrap {
            width: 100%; overflow: hidden; background-color: #000; height: 35px;
            display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .ticker-item {
            white-space: nowrap; font-weight: 700; color: #fbbf24; font-size: 0.75rem; letter-spacing: 0.1em; font-family: 'Teko', sans-serif;
            animation: ticker 25s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate3d(100vw, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Card Background Overrides */
        .content-card {
            background-color: #f4f4f5; /* Very Light Gray */
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* Search Input Matching Directory */
        .modern-input {
            background: #f4f4f5; 
            border: 2px solid #fbbf24;
            color: #18181b; 
            transition: all 0.3s ease;
        }
        .modern-input::placeholder { color: #71717a; }
        .modern-input:focus {
            background: #ffffff; 
            border-color: #fbbf24;
            outline: none;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); 
        }
        
        /* Table Header Hover */
        th.sortable-header:hover {
            background-color: #e4e4e7 !important;
            color: #fbbf24 !important;
        }
        
        /* Table Row Hover */
        tr.table-row:hover {
            background-color: #ffffff !important;
        }
    </style>
</head>
<body>

<div id="loading-message">
    <svg class="animate-spin h-10 w-10 text-pahs-gold mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    Loading Database...
</div>

<div id="root"></div>

<script>
    window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        const loader = document.getElementById('loading-message');
        if(loader) loader.style.display = 'none';

        root.innerHTML = `
            <div style="padding:20px; text-align:center; color:#18181b;">
                <h3 style="color:#dc2626; font-size:20px; font-weight:bold;">App Error</h3>
                <p>Something went wrong loading the app.</p>
                <code style="display:block; background:#f4f4f5; padding:10px; margin-top:10px; text-align:left; font-size:12px; border:1px solid #ccc;">${message}</code>
            </div>
        `;
    };
</script>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { createRoot } = ReactDOM;

    const L = window.LucideReact || {};
    const Search = L.Search || (() => <span>🔍</span>);
    const Trophy = L.Trophy || (() => <span>🏆</span>);
    const Medal = L.Medal || (() => <span>🥇</span>);
    const Filter = L.Filter || (() => <span>Y</span>);
    const ChevronDown = L.ChevronDown || (() => <span>▼</span>);
    const ChevronUp = L.ChevronUp || (() => <span>▲</span>);
    const ChevronLeft = L.ChevronLeft || (() => <span>←</span>);
    const ChevronRight = L.ChevronRight || (() => <span>→</span>);
    const BarChart2 = L.BarChart2 || (() => <span>📊</span>);
    const TableIcon = L.Table || (() => <span>📋</span>);
    const AlertCircle = L.AlertCircle || (() => <span>!</span>);
    const Loader2 = L.Loader2 || (() => <span>...</span>);
    const X = L.X || (() => <span>✕</span>);
    const ArrowLeft = L.ArrowLeft || (() => <span>←</span>);

    const R = window.Recharts || (window.Recharts ? window.Recharts.default : {}) || {};
    const BarChart = R.BarChart;
    const Bar = R.Bar;
    const XAxis = R.XAxis;
    const YAxis = R.YAxis;
    const CartesianGrid = R.CartesianGrid;
    const Tooltip = R.Tooltip;
    const ResponsiveContainer = R.ResponsiveContainer;
    const Cell = R.Cell;

    const SHEET_ID = "2PACX-1vQqz822LpxlX7Tr4RrPW43UuZzi8L1CnT87qSTXbBPMbiHOzoApX5X9itEZjR1WqsR_jGq5BNIzKNqJ";
    const SHEET_GID = "477747733";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${SHEET_GID}&single=true&output=csv`;

    function PIAAChampionshipWidget() {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [searchTerm, setSearchTerm] = useState('');
        const [view, setView] = useState('analytics'); // Updated to default to analytics
        const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
        const [currentPage, setCurrentPage] = useState(1);
        const [itemsPerPage] = useState(50);

        const [classColumn, setClassColumn] = useState('');
        const [availableClasses, setAvailableClasses] = useState([]);
        const [currentClassIndex, setCurrentClassIndex] = useState(0);

        const [columns, setColumns] = useState([]);
        const [winnerColumn, setWinnerColumn] = useState('');
        const [yearColumn, setYearColumn] = useState('');

        useEffect(() => {
            const preloader = document.getElementById('loading-message');
            if(preloader) preloader.style.display = 'none';

            const parseCSV = () => {
                Papa.parse(CSV_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            const firstKey = Object.keys(results.data[0])[0];
                            if (firstKey && firstKey.includes('<!DOCTYPE html>')) {
                                setError("Incorrect Sheet configuration.");
                                setLoading(false);
                                return;
                            }

                            setData(results.data);

                            const cols = Object.keys(results.data[0]);
                            setColumns(cols);

                            const lowerCols = cols.map(c => c.toLowerCase());
                            const winColIndex = lowerCols.findIndex(c => c.includes('winner') || c.includes('champion') || c.includes('school') || c.includes('team'));
                            const yearColIndex = lowerCols.findIndex(c => c.includes('year') || c.includes('date'));
                            const classColIndex = lowerCols.findIndex(c => c === 'class' || c.includes('classification') || c.includes('division'));

                            if (winColIndex !== -1) setWinnerColumn(cols[winColIndex]);
                            else setWinnerColumn(cols[0]);

                            if (yearColIndex !== -1) setYearColumn(cols[yearColIndex]);
                            else setYearColumn(cols[0]);

                            if (classColIndex !== -1) {
                                const detectedClassCol = cols[classColIndex];
                                setClassColumn(detectedClassCol);
                                const uniqueClasses = [...new Set(results.data.map(r => r[detectedClassCol]))]
                                    .filter(k => k && typeof k === 'string' && k.trim() !== '')
                                    .sort((a, b) => {
                                        if (a.length !== b.length) return a.length - b.length;
                                        return a.localeCompare(b);
                                    });
                                setAvailableClasses(uniqueClasses);
                            }
                        } else {
                            setError("No data found.");
                        }
                        setLoading(false);
                    },
                    error: (err) => {
                        console.error(err);
                        setError("Failed to fetch data. Check internet connection.");
                        setLoading(false);
                    }
                });
            };
            parseCSV();
        }, []);

        const filteredData = useMemo(() => {
            return data.filter(row => {
                return Object.values(row).some(val =>
                    String(val).toLowerCase().includes(searchTerm.toLowerCase())
                );
            });
        }, [data, searchTerm]);

        const sortedData = useMemo(() => {
            let sortableItems = [...filteredData];
            if (sortConfig.key) {
                sortableItems.sort((a, b) => {
                    const valA = a[sortConfig.key] ? String(a[sortConfig.key]).toLowerCase() : '';
                    const valB = b[sortConfig.key] ? String(b[sortConfig.key]).toLowerCase() : '';
                    const numA = parseFloat(valA);
                    const numB = parseFloat(valB);
                    if (!isNaN(numA) && !isNaN(numB)) {
                        return sortConfig.direction === 'asc' ? numA - numB : numB - numA;
                    }
                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            return sortableItems;
        }, [filteredData, sortConfig]);

        const isClassMode = classColumn && availableClasses.length > 0 && searchTerm === '';

        const displayItems = useMemo(() => {
            if (isClassMode) {
                const currentClass = availableClasses[currentClassIndex];
                return sortedData.filter(row => row[classColumn] === currentClass);
            } else {
                return sortedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            }
        }, [isClassMode, sortedData, availableClasses, currentClassIndex, classColumn, currentPage, itemsPerPage]);

        const pageCount = Math.ceil(sortedData.length / itemsPerPage);

        const requestSort = (key) => {
            let direction = 'asc';
            if (sortConfig.key === key && sortConfig.direction === 'asc') {
                direction = 'desc';
            }
            setSortConfig({ key, direction });
        };

        const stats = useMemo(() => {
            if (!winnerColumn || data.length === 0) return { topTeams: [], totalChamps: 0, uniqueTeams: 0 };
            const counts = {};
            const nameMap = {};
            data.forEach(row => {
                const rawName = row[winnerColumn];
                if (rawName) {
                    let normalizedName = String(rawName).replace(/\u00A0/g, ' ').replace(/\*/g, '').replace(/\s*[\(\[\{][\s\S]*$/, '').replace(/\b(high school|h\.s\.|hs)\b/gi, "").replace(/[.,\s]+$/, "").trim();
                    if (normalizedName) {
                        const key = normalizedName.toLowerCase();
                        counts[key] = (counts[key] || 0) + 1;
                        if (!nameMap[key] || (nameMap[key] === key && normalizedName !== key)) {
                            nameMap[key] = normalizedName;
                        }
                    }
                }
            });
            const sortedTeams = Object.entries(counts)
                .map(([key, count]) => ({ name: nameMap[key], count }))
                .sort((a, b) => b.count - a.count);
            // Updated to slice the top 15 teams
            return { topTeams: sortedTeams.slice(0, 15), totalChamps: data.length, uniqueTeams: Object.keys(counts).length };
        }, [data, winnerColumn]);

        // UPDATED: Chart colors gradient fading from Gold down to Black expanded to 15 colors
        const CHART_COLORS = [
            '#fbbf24', '#eab222', '#d9a621', '#c8991f', '#b78d1e', 
            '#a6801c', '#95741b', '#846719', '#735b18', '#624e16', 
            '#514215', '#403513', '#2f2912', '#1e1c10', '#0f0f0f'
        ];

        if (loading) return null;

        if (error) return (
            <div className="flex flex-col items-center justify-center h-screen w-full p-6 text-center">
                <AlertCircle className="w-12 h-12 text-red-600 mb-2" />
                <h3 className="text-xl font-bold text-red-900">Database Error</h3>
                <p className="text-red-700">{error}</p>
                <a href="index.html" className="mt-4 px-4 py-2 bg-pahs-dark text-white rounded font-bold font-head text-lg tracking-wide hover:text-pahs-gold">Go Back</a>
            </div>
        );

        return (
            <div className="min-h-screen flex flex-col font-body">

                {/* SCROLLING DISCLAIMER */}
                <div className="ticker-wrap">
                    <div className="ticker-item">
                        • DATA SOURCED FROM PUBLIC RECORDS • INFORMATION MAY VARY • CHECK LOCAL LISTINGS FOR ACCURACY • DISCLAIMER: This database pulls publicly available information from the internet to update and may not be 100% accurate.
                    </div>
                </div>

                {/* TOP NAVIGATION BAR */}
                <nav className="bg-pahs-dark text-white shadow-xl sticky top-0 z-50 border-b border-white/10">
                    <div className="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
                        
                        {/* Left side contains Back Button & Title */}
                        <div className="flex items-center gap-4">
                            <a href="index.html" className="group flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-pahs-gold text-white hover:text-black border border-white/10 hover:border-pahs-gold rounded-lg transition-all duration-300">
                                <ArrowLeft size={16} />
                                <span className="font-bold font-head text-lg pt-0.5 tracking-wide uppercase">Back</span>
                            </a>
                            <h1 className="text-3xl font-bold font-head tracking-wide hidden sm:block">Championship History</h1>
                        </div>

                        {/* Right side contains Logo branding */}
                        <div className="flex items-center gap-2 font-head text-2xl tracking-wide">
                            <Trophy className="text-pahs-gold" size={24} />
                            <span className="font-bold">PAHS<span className="text-pahs-gold">Football</span></span>
                        </div>
                        
                    </div>
                </nav>

                <div className="flex-grow w-full max-w-7xl mx-auto p-4 md:p-8">

                    {/* HERO SECTION */}
                    <div className="mb-8 content-card p-6 rounded-2xl">
                        <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
                            <div>
                                <div className="flex items-center gap-2 text-pahs-gold font-bold text-sm uppercase tracking-wider mb-2 drop-shadow-sm">
                                    <Medal size={16} /> Public Records
                                </div>
                                <h2 className="text-3xl md:text-4xl font-extrabold text-gray-900 font-head tracking-wide uppercase">State Title Archive</h2>
                                <p className="text-gray-600 mt-1 font-medium">Searchable archive of Pennsylvania state football titles.</p>
                            </div>

                            {/* View Toggles */}
                            <div className="flex bg-gray-200 p-1 rounded-xl shadow-inner border border-gray-300">
                                <button
                                    onClick={() => setView('table')}
                                    className={`flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-bold transition-all font-head text-lg tracking-wide uppercase ${
                                        view === 'table' ? 'bg-white text-black shadow-md border border-gray-200' : 'text-gray-500 hover:text-gray-800'
                                    }`}
                                >
                                    <TableIcon size={16} /> Records
                                </button>
                                <button
                                    onClick={() => setView('analytics')}
                                    className={`flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-bold transition-all font-head text-lg tracking-wide uppercase ${
                                        view === 'analytics' ? 'bg-white text-black shadow-md border border-gray-200' : 'text-gray-500 hover:text-gray-800'
                                    }`}
                                >
                                    <BarChart2 size={16} /> Analytics
                                </button>
                            </div>
                        </div>

                        {/* Stats Summary Row */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 pt-6 border-t border-gray-300">
                            <div>
                                <p className="text-xs text-gray-500 font-bold uppercase tracking-wider">Total Titles</p>
                                <p className="text-3xl font-bold font-head text-gray-900">{stats.totalChamps}</p>
                            </div>
                            <div>
                                <p className="text-xs text-gray-500 font-bold uppercase tracking-wider">Unique Schools</p>
                                <p className="text-3xl font-bold font-head text-gray-900">{stats.uniqueTeams}</p>
                            </div>
                            <div className="col-span-2 md:col-span-2">
                                <p className="text-xs text-gray-500 font-bold uppercase tracking-wider">Most Wins</p>
                                <div className="flex items-baseline gap-2">
                                    <p className="text-3xl font-bold font-head text-pahs-gold drop-shadow-sm">{stats.topTeams[0]?.count || 0}</p>
                                    <p className="text-lg font-medium font-head tracking-wide text-gray-800 truncate uppercase">{stats.topTeams[0]?.name}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    {view === 'table' ? (
                        <div className="space-y-4">
                            {/* Search Bar */}
                            <div className="relative group z-10">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <Search className="text-gray-400 group-focus-within:text-pahs-gold transition-colors" size={20} />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Search school, year, or classification..."
                                    value={searchTerm}
                                    onChange={(e) => {
                                        setSearchTerm(e.target.value);
                                        setCurrentPage(1);
                                    }}
                                    className="modern-input w-full pl-11 pr-12 py-3.5 rounded-xl font-medium"
                                />
                                {searchTerm && (
                                    <button
                                        onClick={() => setSearchTerm('')}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 hover:bg-gray-200 rounded-full text-gray-400 hover:text-red-500 transition-colors"
                                    >
                                        <X size={16} />
                                    </button>
                                )}
                            </div>

                            {/* Table */}
                            <div className="content-card rounded-xl overflow-hidden flex flex-col relative z-0">
                                <div className="overflow-x-auto custom-scrollbar flex-grow" style={{ maxHeight: '600px' }}>
                                    <table className="w-full text-left border-collapse bg-white">
                                        <thead className="bg-[#e4e4e7] sticky top-0 z-10 shadow-sm border-b-2 border-gray-300">
                                            <tr>
                                                {columns.map((col) => (
                                                    <th
                                                        key={col}
                                                        onClick={() => requestSort(col)}
                                                        className="sortable-header px-6 py-4 text-xs font-bold text-gray-700 uppercase tracking-wider cursor-pointer transition-colors select-none whitespace-nowrap group font-body"
                                                    >
                                                        <div className="flex items-center gap-1">
                                                            {col}
                                                            <span className="text-gray-400 group-hover:text-pahs-gold transition-colors">
                                                                {sortConfig.key === col ? (
                                                                    sortConfig.direction === 'asc' ? <ChevronUp size={14} /> : <ChevronDown size={14} />
                                                                ) : <Filter size={12} className="opacity-0 group-hover:opacity-100" />}
                                                            </span>
                                                        </div>
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-200">
                                            {displayItems.length > 0 ? (
                                                displayItems.map((row, idx) => (
                                                    <tr
                                                        key={idx}
                                                        className="table-row hover:bg-gray-50 transition-colors even:bg-[#f8f8f9]"
                                                    >
                                                        {columns.map((col) => (
                                                            <td key={`${idx}-${col}`} className="px-6 py-4 text-sm text-gray-800 whitespace-nowrap font-medium">
                                                                {col === winnerColumn ? (
                                                                    <span className="font-bold text-black">{row[col]}</span>
                                                                ) : (
                                                                    row[col]
                                                                )}
                                                            </td>
                                                        ))}
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan={columns.length} className="px-6 py-20 text-center bg-[#f4f4f5]">
                                                        <div className="flex flex-col items-center justify-center text-gray-500">
                                                            <Search size={48} className="mb-4 opacity-30" />
                                                            <p className="text-lg font-bold font-head uppercase tracking-wide text-gray-600">No records found</p>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Pagination / Controls Footer */}
                                <div className="border-t border-gray-300 p-4 bg-[#e4e4e7] flex flex-col sm:flex-row items-center justify-between gap-4">
                                    {isClassMode ? (
                                        <>
                                            <div className="text-sm text-gray-600 font-bold uppercase tracking-wide font-head text-lg">
                                                Viewing <span className="text-pahs-gold drop-shadow-sm font-black ml-1">Class {availableClasses[currentClassIndex]}</span>
                                            </div>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => setCurrentClassIndex(curr => Math.max(0, curr - 1))}
                                                    disabled={currentClassIndex === 0}
                                                    className="flex items-center gap-1 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold uppercase tracking-wider font-head text-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed text-gray-800 shadow-sm transition-colors hover:text-pahs-gold hover:border-pahs-gold"
                                                >
                                                    <ChevronLeft size={16} className="mt-0.5" /> Prev
                                                </button>
                                                <button
                                                    onClick={() => setCurrentClassIndex(curr => Math.min(availableClasses.length - 1, curr + 1))}
                                                    disabled={currentClassIndex === availableClasses.length - 1}
                                                    className="flex items-center gap-1 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-bold uppercase tracking-wider font-head text-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed text-gray-800 shadow-sm transition-colors hover:text-pahs-gold hover:border-pahs-gold"
                                                >
                                                    Next <ChevronRight size={16} className="mt-0.5" />
                                                </button>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div className="text-sm text-gray-600 font-medium">
                                                Page <span className="font-bold text-gray-900">{currentPage}</span> of {pageCount}
                                            </div>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => setCurrentPage(curr => Math.max(curr - 1, 1))}
                                                    disabled={currentPage === 1}
                                                    className="p-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-pahs-gold disabled:opacity-50 disabled:cursor-not-allowed text-gray-800 shadow-sm transition-colors"
                                                >
                                                    <ChevronLeft size={20} />
                                                </button>
                                                <button
                                                    onClick={() => setCurrentPage(curr => Math.min(curr + 1, pageCount))}
                                                    disabled={currentPage === pageCount}
                                                    className="p-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-pahs-gold disabled:opacity-50 disabled:cursor-not-allowed text-gray-800 shadow-sm transition-colors"
                                                >
                                                    <ChevronRight size={20} />
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                            <div className="content-card p-6 md:p-8 rounded-2xl">
                                <div className="flex items-center justify-between mb-8">
                                    <div>
                                        <h3 className="text-2xl font-bold font-head uppercase tracking-wide text-gray-900">Leaderboard</h3>
                                        {/* Updated to state Top 15 Schools */}
                                        <p className="text-sm font-medium text-gray-600">Top 15 Schools by Championship Count</p>
                                    </div>
                                </div>
                                {BarChart ? (
                                    {/* Increased height to 700px to accommodate 15 teams comfortably */}
                                    <div className="h-[700px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={stats.topTeams} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#d4d4d8" />
                                                <XAxis type="number" hide />
                                                <YAxis
                                                    dataKey="name"
                                                    type="category"
                                                    width={150}
                                                    tick={{fontSize: 12, fill: '#3f3f46', fontWeight: 700}}
                                                    interval={0}
                                                />
                                                <Tooltip
                                                    cursor={{fill: 'rgba(251, 191, 36, 0.1)'}}
                                                    contentStyle={{
                                                        borderRadius: '8px',
                                                        border: '2px solid #fbbf24',
                                                        boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)',
                                                        backgroundColor: '#18181b',
                                                        color: '#f4f4f5',
                                                        fontWeight: 'bold'
                                                    }}
                                                    itemStyle={{ color: '#fbbf24' }}
                                                />
                                                <Bar dataKey="count" radius={[0, 4, 4, 0]} barSize={28} label={{ position: 'right', fill: '#18181b', fontSize: 13, fontWeight: '800', offset: 8 }}>
                                                    {stats.topTeams.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={CHART_COLORS[index % CHART_COLORS.length]} />
                                                    ))}
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                ) : (
                                    <div className="text-center p-10 text-gray-500 bg-gray-200 rounded-lg border border-gray-300 font-bold">
                                        Chart library failed to load. Use "Records" view.
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <div className="mt-8 text-center text-sm text-gray-700 font-medium pb-8 uppercase tracking-widest font-head">
                        <p>Data provided by PAHSFootball.com</p>
                    </div>
                </div>
            </div>
        );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<PIAAChampionshipWidget />);
</script>
