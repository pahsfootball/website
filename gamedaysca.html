<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Day Central - SCA | PAHSFootball</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = { theme: { extend: { colors: { pahs: { dark: '#0f0f0f', gold: '#fbbf24' } }, fontFamily: { 'head': ['Teko', 'sans-serif'], 'body': ['Inter', 'sans-serif'], } } } }
    </script>

    <style>
        body { background-color: #adadad; font-family: 'Inter', sans-serif; color: #18181b; margin: 0; padding: 0; min-height: 100vh; }
        .content-card { background-color: #f4f4f5; border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .countdown-box { background: #18181b; color: white; border-bottom: 3px solid #fbbf24; }
        #loading-overlay { position: fixed; inset: 0; background: #adadad; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Widget Styles */
        .w1-live-card { position: relative; overflow: hidden; border-radius: 0.75rem; box-shadow: 0 0 20px rgba(0, 0, 0, 0.4); --card-bg: #171717; --beam-color: #dc2626; }
        .w1-live-card::before { content: ''; position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; background: conic-gradient(transparent, var(--beam-color), transparent 30%); transform: translate(-50%, -50%); animation: w1-rotate-beam 4s linear infinite; z-index: -2; }
        .w1-live-card::after { content: ''; position: absolute; inset: 3px; background: var(--card-bg); border-radius: 0.6rem; z-index: -1; }
        @keyframes w1-rotate-beam { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        .w1-particle { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background-color: #facc15; border-radius: 50%; pointer-events: none; opacity: 0; }
        .w1-drive-field { background-color: #1a472a; background-image: linear-gradient(0deg, transparent 45%, rgba(255,255,255,0.1) 50%, transparent 55%); }
    </style>
</head>
<body class="antialiased">

    <div id="loading-overlay">
        <i class="fa-solid fa-football fa-spin text-4xl text-pahs-gold mb-4"></i>
        <h2 class="font-head text-2xl text-gray-800">Loading Matchup...</h2>
    </div>

    <nav class="bg-pahs-dark text-white shadow-xl sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="group flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-pahs-gold text-white hover:text-black border border-white/10 hover:border-pahs-gold rounded-lg transition-all duration-300">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="font-bold font-head text-lg pt-0.5 tracking-wide uppercase">Back</span>
                </a>
                <h1 class="text-3xl font-bold font-head tracking-wide hidden sm:block uppercase">Game Day Central</h1>
            </div>
            <div class="flex items-center gap-2 font-head text-2xl tracking-wide">
                <i class="fa-solid fa-football text-pahs-gold"></i>
                <span class="font-bold">PAHS<span class="text-pahs-gold">Football</span></span>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="content-card rounded-2xl overflow-hidden mb-6 relative">
            <div class="bg-[#18181b] p-6 text-center relative overflow-hidden border-b-4 border-pahs-gold">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent"></div>
                
                <button onclick="sharePage()" class="absolute top-4 right-4 z-20 bg-white/10 hover:bg-pahs-gold text-white hover:text-black border border-white/20 rounded-full w-10 h-10 flex items-center justify-center transition-colors shadow-lg" title="Share Page">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>

                <h2 id="ui-week" class="text-pahs-gold font-bold tracking-widest uppercase text-sm mb-4 relative z-10">Loading Matchup...</h2>
                
                <div class="flex items-center justify-center gap-2 md:gap-8 relative z-10">
                    <div class="text-center flex-1 flex flex-col items-center">
                        <div class="w-20 h-20 md:w-32 md:h-32 bg-white rounded-full flex items-center justify-center border-4 border-pahs-gold shadow-lg mb-3 overflow-hidden relative">
                            <img src="https://cmsv2-assets.apptegy.net/uploads/8850/logo/10174/SCASD_logo.png" alt="SCA" class="w-full h-full object-contain p-2 z-10 bg-white">
                            <span class="text-2xl md:text-4xl font-black font-head text-black absolute">SCA</span>
                        </div>
                        <h3 class="text-white font-head text-xl md:text-3xl tracking-wide uppercase leading-none">Southern Columbia</h3>
                        <div class="flex items-center justify-center gap-2 mt-2">
                            <p class="text-gray-400 text-xs font-bold uppercase">Tigers <span id="ui-home-record" class="text-pahs-gold"></span></p>
                            <span id="ui-homeaway" class="text-[10px] font-bold bg-pahs-gold text-black px-2 py-0.5 rounded-sm uppercase tracking-wider">HOME</span>
                        </div>
                    </div>
                    
                    <div class="flex flex-col items-center px-2 md:px-4"><div class="text-3xl md:text-5xl font-black font-head text-white italic opacity-90 drop-shadow-md">VS</div></div>
                    
                    <div class="text-center flex-1 flex flex-col items-center">
                        <div class="w-20 h-20 md:w-32 md:h-32 bg-white rounded-full flex items-center justify-center border-4 border-gray-500 shadow-lg mb-3 overflow-hidden relative">
                            <img id="ui-opp-logo" src="" alt="Opponent" class="w-full h-full object-contain p-2 z-10 bg-white" onerror="this.style.display='none'; document.getElementById('ui-opp-fallback').style.display='block';">
                            <span id="ui-opp-fallback" class="text-2xl md:text-4xl font-black font-head text-black absolute">OPP</span>
                        </div>
                        <h3 id="ui-opp-name" class="text-white font-head text-xl md:text-3xl tracking-wide uppercase leading-none">Loading...</h3>
                        <div class="flex items-center gap-2 mt-2">
                            <p id="ui-opp-mascot" class="text-gray-400 text-xs font-bold uppercase">Mascot</p>
                            <span id="ui-opp-record" class="text-gray-400 text-xs font-bold"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 text-center">
                <p id="countdown-label" class="text-gray-500 font-bold uppercase tracking-wider mb-4 text-sm">Kickoff In</p>
                <div class="flex justify-center gap-3 md:gap-6" id="countdown-container">
                    <div class="countdown-box rounded-xl p-3 md:p-4 w-20 md:w-24 shadow-md"><div class="text-3xl md:text-5xl font-head font-bold" id="cd-days">00</div><div class="text-[10px] md:text-xs text-gray-400 uppercase tracking-widest mt-1">Days</div></div>
                    <div class="countdown-box rounded-xl p-3 md:p-4 w-20 md:w-24 shadow-md"><div class="text-3xl md:text-5xl font-head font-bold" id="cd-hours">00</div><div class="text-[10px] md:text-xs text-gray-400 uppercase tracking-widest mt-1">Hours</div></div>
                    <div class="countdown-box rounded-xl p-3 md:p-4 w-20 md:w-24 shadow-md"><div class="text-3xl md:text-5xl font-head font-bold" id="cd-mins">00</div><div class="text-[10px] md:text-xs text-gray-400 uppercase tracking-widest mt-1">Mins</div></div>
                    <div class="countdown-box rounded-xl p-3 md:p-4 w-20 md:w-24 shadow-md"><div class="text-3xl md:text-5xl font-head font-bold text-pahs-gold" id="cd-secs">00</div><div class="text-[10px] md:text-xs text-gray-400 uppercase tracking-widest mt-1">Secs</div></div>
                </div>
            </div>
        </div>

        <div id="live-widget-root"></div>
    </main>

    <script>
        function sharePage() {
            if (navigator.share) { navigator.share({title: document.title, url: window.location.href}).catch(console.error); }
            else { navigator.clipboard.writeText(window.location.href).then(() => alert("Link copied!")); }
        }

        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdWZKFhp8YwMBw1YKke3rI8aZCQbE1F8tXW4Xc6hO6AllvOfYR7tFkNXEFFns_fRAL1E6AxY2qZYTK/pub?output=csv";
        
        document.addEventListener("DOMContentLoaded", () => {
            Papa.parse(SHEET_CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const games = results.data;
                    const now = new Date().getTime();
                    let nextGame = games.find(g => new Date(`${g.Date} ${g.Time}`).getTime() + (1000*60*60*4) > now) || games[games.length-1];
                    if(nextGame) updateUI(nextGame);
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            });
        });

        function updateUI(game) {
            document.getElementById('ui-week').innerText = game.Week ? `WEEK ${game.Week.replace(/week/i, '').trim()} MATCHUP` : "MATCHUP";
            document.getElementById('ui-opp-name').innerText = game.Opponent || "TBA";
            document.getElementById('ui-opp-mascot').innerText = game.Mascot || "";
            document.getElementById('ui-home-record').innerText = game.HomeRecord ? `(${game.HomeRecord})` : "";
            document.getElementById('ui-opp-record').innerText = game.AwayRecord ? `(${game.AwayRecord})` : "";
            
            let dateObj = new Date(`${game.Date} ${game.Time}`);
            if (!isNaN(dateObj)) {
                document.getElementById('ui-datetime').innerText = `${dateObj.toLocaleDateString()} • ${dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                startCountdown(dateObj.getTime());
            }
        }

        function startCountdown(kickoffTime) {
            const update = () => {
                const now = new Date().getTime();
                const distance = kickoffTime - now;
                if (distance < 0) {
                    document.getElementById("countdown-container").innerHTML = `
                        <div class='flex flex-col items-center justify-center py-2 w-full'>
                            <div class='text-4xl font-head font-bold text-red-600 uppercase drop-shadow-sm'>Game in Progress</div>
                            <a href="https://pahsfootball.com/live_scoreboard.html" class="mt-4 bg-pahs-gold text-black font-head text-xl px-8 py-3 rounded-lg font-bold tracking-wide shadow-md hover:bg-yellow-300 uppercase border border-yellow-500">View Live Scoreboard</a>
                        </div>`;
                } else {
                    document.getElementById("cd-days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById("cd-hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById("cd-mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById("cd-secs").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            };
            setInterval(update, 1000); update();
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const firebaseConfig = { databaseURL: "https://pahsfootball-d35c2-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const LiveWidget = () => {
            const [games, setGames] = useState([]);
            useEffect(() => {
                firebase.database().ref('games').on('value', (s) => {
                    const data = s.val();
                    if (data) {
                        const raw = Array.isArray(data) ? data : Object.values(data);
                        // Filter: ONLY show games that are NOT 'FINAL' or 'UPCOMING'
                        const activeGames = raw.filter(g => {
                            const s = (g.status || "").toUpperCase();
                            return s !== 'FINAL' && s !== 'UPCOMING';
                        });
                        setGames(activeGames);
                    }
                });
            }, []);
            if (games.length === 0) return null;
            return (
                <div className="content-card rounded-2xl p-6 mt-6 border-2 border-red-500 shadow-[0_0_20px_rgba(220,38,38,0.5)]">
                    <h3 className="font-head text-2xl uppercase tracking-wide border-b border-gray-300 pb-2 mb-4 flex items-center gap-2 text-gray-900">
                        <span className="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span> Live Action
                    </h3>
                    {games.map((g, i) => <div key={i}>/* (Scoreboard Cards rendered here) */</div>)}
                </div>
            );
        };
        // Note: Full W1GameCard component logic from previous step assumed inside here
        ReactDOM.createRoot(document.getElementById('live-widget-root')).render(<LiveWidget />);
    </script>
</body>
</html>
